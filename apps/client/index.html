:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: rgba(32,30,29,0.400);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: 'Instrument Sans', system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: 'Instrument Sans', system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px rgba(45,43,43,0.140);
  --shadow-md: 0 3px 10px rgba(45,43,43,0.160);
  --shadow-lg: 0 12px 32px rgba(45,43,43,0.220);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: rgba(242,240,234,0.550);
}
.text-muted { color: rgba(242,240,234,0.550); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: rgba(242,84,45,0.300); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: rgba(242,240,234,0.070); }
.btn-secondary:active { background: rgba(242,240,234,0.140); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: rgba(242,84,45,0.100); }
.btn-ghost:active { background: rgba(242,84,45,0.180); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: rgba(242,240,234,0.700);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: rgba(242,240,234,0.450); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: rgba(242,240,234,0.070); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: rgba(242,240,234,0.500);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(242,240,234,0.600);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: rgba(242,240,234,0.040); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: rgba(14,18,22,0.500);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

</style>

<div id="app"></div>
<template id="app-template">
<div class="ph" data-screen-label="Client app">
<div class="sb"><span>9:41</span><span style="letter-spacing:.14em">▮▮▮ ⏵ ▰</span></div>

<sc-if value="{{ c_walletSoon }}">
<div class="bd" data-screen-label="Client / Membership coming soon">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--color-text)">
<button class="btn btn-icon btn-secondary" data-click="{{ goHome }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m0 0 6-6m-6 6 6 6"></path></svg></button>
<h4 style="margin:0">Membership</h4>
</div>
<div style="padding:24px 16px 22px;background:var(--color-surface)">
<span class="tag tag-accent">Coming soon</span>
<h3 style="margin:16px 0 8px;font-size:40px">RKVR Membership</h3>
<p style="font-size:13.5px;line-height:1.5;opacity:.8;margin:0">12 services a month, any service, for $99 a month (founding rate). À la carte is always an option.</p>
<sc-if value="{{ wNotJoined }}"><button class="btn btn-primary btn-block" data-click="{{ wJoin }}" style="margin-top:18px">Join the waitlist</button>
<p style="font-size:11px;opacity:.6;margin:10px 0 0">We'll let you know the day memberships open. No charge, no commitment.</p></sc-if>
<sc-if value="{{ wJoined }}"><div style="margin-top:18px;padding:12px 14px;border-left:3px solid var(--color-accent);background:var(--color-accent-100)">
<div style="font:600 13.5px 'Instrument Sans',system-ui,-apple-system,sans-serif">You're on the list</div>
<div style="font-size:12px;opacity:.8;margin-top:2px">We'll send you an app notification the day memberships open.</div></div></sc-if>
</div>
<div style="padding:22px 16px 28px">
<div class="sl">Until then</div>
<p style="font-size:13px;line-height:1.5;opacity:.8;margin:8px 0 0">Book and pay per visit. A $40 deposit holds your time, and the rest is paid at your visit.</p>
<button class="btn btn-secondary btn-block" data-click="{{ goBook }}" style="margin-top:14px;justify-content:flex-start">Book a service</button>
</div>
</div>
</sc-if>

<sc-if value="{{ c_wallet }}">
<div class="bd" data-screen-label="Client / Membership wallet">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--color-text)">
<button class="btn btn-icon btn-secondary" data-click="{{ goHome }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m0 0 6-6m-6 6 6 6"></path></svg></button>
<h4 style="margin:0">Wallet</h4>
<span style="margin-left:auto;font:600 10.5px 'Instrument Sans',system-ui,-apple-system,sans-serif;letter-spacing:.1em;opacity:.55">{{ wPlan }}</span>
</div>
<div style="padding:20px 16px 18px;background:var(--color-surface)">
<div class="card-kicker">Services this month</div>
<div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">
<span style="font:800 72px 'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;line-height:1">{{ wCredits }}</span>
<span style="font:600 14px 'Instrument Sans',system-ui,-apple-system,sans-serif;opacity:.75">of {{ wMonthly }} left</span>
</div>
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px" aria-hidden="true">
<sc-for list="{{ wDots }}" as="d"><span style="height:10px;background:{{ d.bg }};border:1px solid {{ d.bd }}"></span></sc-for>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;border-top:1px solid var(--color-divider)">

(function(){
  var tplEl=document.getElementById('app-template');
  var root=document.getElementById('app');
  function get(scope,path){var parts=path.split('.');var v=scope;for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}return v;}
  var ONE=/^\s*\{\{\s*([\w.]+)\s*\}\}\s*$/, ANY=/\{\{\s*([\w.]+)\s*\}\}/g;
  function interp(str,scope){return str.replace(ANY,function(_,p){var v=get(scope,p);return v==null?'':String(v);});}
  function build(node,scope,out){
    if(node.nodeType===3){out.appendChild(document.createTextNode(interp(node.nodeValue,scope)));return;}
    if(node.nodeType!==1)return;
    var tag=node.tagName.toLowerCase();
    if(tag==='sc-if'){var m=ONE.exec(node.getAttribute('value')||'');if(m&&get(scope,m[1]))kids(node,scope,out);return;}
    if(tag==='sc-for'){var m2=ONE.exec(node.getAttribute('list')||'');var list=m2?get(scope,m2[1]):[];var as=node.getAttribute('as');
      (list||[]).forEach(function(item){var s=Object.create(scope);s[as]=item;kids(node,s,out);});return;}
    var el=node.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(node.namespaceURI,node.tagName):document.createElement(tag);
    for(var i=0;i<node.attributes.length;i++){var a=node.attributes[i];
      if(a.name==='data-click'){var m3=ONE.exec(a.value);if(m3){var fn=get(scope,m3[1]);if(typeof fn==='function')el.addEventListener('click',fn);}continue;}
      el.setAttribute(a.name,a.value.indexOf('{{')>-1?interp(a.value,scope):a.value);}
    kids(node,scope,el);out.appendChild(el);
  }
  function kids(node,scope,out){var c=node.content?node.content.childNodes:node.childNodes;for(var i=0;i<c.length;i++)build(c[i],scope,out);}
  window.DCLogic=function(){};
  window.DCLogic.prototype.setState=function(p){for(var k in p)this.state[k]=p[k];schedule();};
  var app, queued=false, lastKey='';
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;render();});}
  function render(){
    var vals=app.renderVals();
    var key=['c_cal','c_walletSoon','c_wallet','c_home','c_shop','c_prod','c_cart','c_co','c_done','c_me','b0','b1','b2','b3','care0','care1','care2','p_today','p_appt','p_sched','p_pay0','p_pay1','p_pay2','p_suite','p_req','p_supply'].filter(function(k){return vals[k];}).join();
    var old=root.querySelector('.bd'), top=old&&key===lastKey?old.scrollTop:0;
    var frag=document.createDocumentFragment(); kids(tplEl,vals,frag);
    root.innerHTML=''; root.appendChild(frag);
    var nb=root.querySelector('.bd'); if(nb) nb.scrollTop=top; lastKey=key;
  }
  window.__start=function(C){app=new C();render();};
})();

function icsFold(line) { const out = []; while (line.length > 73) { out.push(line.slice(0, 73)); line = ' ' + line.slice(73); } out.push(line); return out.join('\r\n'); }
function icsStamp(d, mins) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, mins); return ymd(x).replace(/-/g, '') + 'T' + String(x.getHours()).padStart(2, '0') + String(x.getMinutes()).padStart(2, '0') + '00'; }
function buildIcs(list) {
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//RKVR//Client app//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:RKVR visits', 'X-WR-TIMEZONE:' + CAL_TZ];
  list.forEach(b => {
    const t = parseTime(b.time), start = t.h * 60 + t.m, d = dateOf(b.date);
    let at = start;
    const order = b.svcs.map((id, i) => { const x = svcById(id); const line = (i + 1) + '. ' + fmtTime(at) + ' ' + x.name + ' (' + svcWho(x) + ')'; at += svcMin(x); return line; });
    L.push('BEGIN:VEVENT', 'UID:' + b.id + '@rkvr.app', 'DTSTAMP:' + stamp,
      'DTSTART;TZID=' + CAL_TZ + ':' + icsStamp(d, start), 'DTEND;TZID=' + CAL_TZ + ':' + icsStamp(d, start + visitMins(b)),
      'SUMMARY:' + icsEsc(visitTitle(b) + ' · RKVR'), 'LOCATION:' + icsEsc(SUITE_PLACE),
      'DESCRIPTION:' + icsEsc('Your RKVR visit, in order:\n' + order.join('\n') + '\nManage it in the RKVR app.'));
    if (b.repeat === 'weekly') L.push('RRULE:FREQ=WEEKLY');
    if (b.repeat === 'monthly') L.push('RRULE:FREQ=MONTHLY');
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(visitTitle(b) + ' at RKVR'), 'TRIGGER:-PT2H', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function downloadIcs(list, name) {
  const blob = new Blob([buildIcs(list)], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

      apptPrice: money(AGENDA[s.pAppt].price), apptBalance: money(Math.max(0, AGENDA[s.pAppt].price - 40)),
      collectFor: () => this.set({pTab:'collect', pRoute:'', payStep:0,
        amt: String(Math.max(0, AGENDA[s.pAppt].price - 40)),
        payClient: AGENDA[s.pAppt].client, payFor: AGENDA[s.pAppt].svc.split(' · ')[0]}),
      hours: HOURS.map((h, i) => ({label:h.label, busy: !!h.client, client:h.client || '', svc:h.svc || '',
        bg: h.client === 'Jordan Ellis' ? ACC : 'var(--color-surface)',
        fg: h.client === 'Jordan Ellis' ? 'var(--color-bg)' : INK,
        open: () => this.set({pRoute:'appt', pAppt: Math.min(3, AGENDA.findIndex(a => a.client === h.client) < 0 ? 0 : AGENDA.findIndex(a => a.client === h.client))})})),

      amtText: '$' + (s.amt === '' ? '0' : s.amt),
      payClient: s.payClient, payFor: s.payFor,
      payoutText: money(Math.max(0, Math.round(amtNum + 18 - 2.83))),
      quick: [{v:'145', label:'$145 facial'}, {v:'95', label:'$95 lash fill'}, {v:'325', label:'$325 microneedling'}]
        .map(q => ({label:q.label, pick: () => this.set({amt:q.v})})),
      keys: ['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k => ({label:k,
        press: () => {
          if (k === '⌫') return this.set({amt: s.amt.slice(0, -1)});
          if (k === '.' && s.amt.includes('.')) return;
          if (s.amt.length > 6) return;
          this.set({amt: s.amt + k});
        }})),
      payNext: () => { if (amtNum > 0) this.set({payStep:1}); },
      payDone: () => this.set({payStep:2}),
      payReset: () => this.set({payStep:0, amt:''}),

      payRent: () => this.set({pTab:'collect', pRoute:'', payStep:0, amt:'850', payClient:'RKVR Suites', payFor:'September rent'}),
      newReq: () => this.set({pRoute:'req', reqSent:false}),
      reqForm: !s.reqSent, reqSent: s.reqSent,
      reqSubmit: () => this.set({reqSent:true}),

      supply: SUPPLY.map(i => ({name:i.name, stock:i.stock, priceText: money(i.price), qty: s.qty[i.id] || 0,
        inc: () => this.set({qty: Object.assign({}, s.qty, {[i.id]: (s.qty[i.id] || 0) + 1})}),
        dec: () => this.set({qty: Object.assign({}, s.qty, {[i.id]: Math.max(0, (s.qty[i.id] || 0) - 1)})})})),
      supplyTotal: money(supplyTotal)
    };
  }
}


window.__start(Component);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
