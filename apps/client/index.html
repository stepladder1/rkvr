<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RKVR">
<meta name="theme-color" content="#0E1216">
<title>RKVR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Phone app, one column. Same look as the front-desk Check-In: dark, condensed headlines, orange accent. */
:root { --bg:#0E1216; --panel:#182027; --panel2:#1F2830; --line:rgba(242,240,234,.12); --line2:rgba(242,240,234,.26); --fg:#F2F0EA; --muted:#A9B1B8; --soft:#C9CFD4; --accent:#F2542D; --accentText:#FF7A57; --ink:#0E1216; --ice:#7CCBFF; --iceBg:rgba(124,203,255,.12); --iceLine:rgba(124,203,255,.4); --accBg:rgba(242,84,45,.14);
  --display:'Big Shoulders Display','Arial Narrow',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px; border-bottom: 1px solid var(--line); }
.logo { height: 24px; width: auto; display: block; color: var(--fg); }
main { flex: 1; padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 96px); display: flex; flex-direction: column; gap: 18px; }
.disp { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; }
.h1 { font: 800 52px/.92 var(--display); text-transform: uppercase; }
.h2 { font: 800 28px/1 var(--display); text-transform: uppercase; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accentText); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card.hot { border-color: var(--accent); }
.btn { min-height: 48px; padding: 0 18px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.btn.big { min-height: 56px; font-size: 17px; width: 100%; }
.btn.sm { min-height: 40px; font-size: 14px; padding: 0 14px; }
.btn:disabled { background: var(--panel2); border-color: var(--panel2); color: var(--muted); }
.link { background: none; border: 0; color: var(--accentText); font-weight: 700; padding: 8px 0; text-align: left; }
.row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .n { font: 800 22px/1 var(--display); color: var(--accentText); }
.chip { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; border: 1px solid var(--line2); }
.chip.ice { background: rgba(124,203,255,.14); color: var(--ice); border-color: var(--iceLine); }
.chip.acc { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.note { padding: 12px 14px; border-left: 3px solid var(--ice); background: var(--iceBg); font-size: 14.5px; }
.err { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accBg); font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; }
.field input, .field select { min-height: 52px; padding: 0 14px; border: 1px solid var(--line2); background: var(--panel); font-size: 17px; font-weight: 500; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.check input { width: 24px; height: 24px; accent-color: #F2542D; flex-shrink: 0; margin: 0; }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; text-align: center; padding: 6px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
.steps span.on { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.steps span.done { color: var(--fg); border-color: var(--line2); }
.svc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; text-align: left; padding: 14px 16px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); width: 100%; }
.svc.on { border-color: var(--accent); background: var(--panel2); }
.svc:disabled { opacity: .4; }
.cb { width: 28px; height: 28px; border: 2px solid var(--line2); color: var(--ink); font: 800 16px/1 var(--display); display: flex; align-items: center; justify-content: center; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cat { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.days button { flex: 0 0 64px; height: 72px; border: 1px solid var(--line2); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.days button b { font: 800 26px/1 var(--display); }
.days button span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.days button[aria-pressed="true"] span { color: var(--ink); }
.slots { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.slots button { height: 48px; border: 1px solid var(--line2); background: var(--panel); font-weight: 700; font-size: 15px; }
.slots button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.slots button:disabled { opacity: .3; text-decoration: line-through; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: rgba(14,18,22,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5,1fr); }
.bar button { height: 62px; background: none; border: 0; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.bar button[aria-current="page"] { color: var(--accentText); }
.bar svg { width: 22px; height: 22px; }
.sticky-cta { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); background: linear-gradient(transparent, var(--bg) 30%); padding-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.sheet-scrim { position: fixed; inset: 0; z-index: 10; background: rgba(5,8,10,.75); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-top: 1px solid var(--line2); padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; gap: 14px; }
.sigwrap { position: relative; height: 180px; border: 2px dashed var(--line2); background: var(--panel); }
.sigwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.sigwrap .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
.tick { width: 84px; height: 84px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--fg); color: var(--ink); padding: 12px 18px; font-weight: 700; z-index: 20; max-width: calc(100% - 40px); text-align: center; }
.welcome .logo, .top .logo { align-self: flex-start; flex-shrink: 0; }
.welcome { min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top, 0px) + 28px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 18px; max-width: 520px; margin: 0 auto; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="rkvr-client.js"></script>
<script>
(function () {
  const C = window.RKVR_CLOUD, CFG = window.RKVR_CONFIG || {};
  const MAX = 3;
  const ROOM = { cryo: 'Cryo Chamber', red: 'Red Light Bed', comp: 'Compression', chair: 'Massage Chair', iv: 'IV Lounge', wl: 'Consult Room', tw: 'Video visit' };
  const CAT = { cryo: 'Cryotherapy', red: 'Red light', comp: 'Compression', chair: 'Massage chair', iv: 'IV therapy', wl: 'Weight loss', tw: 'TeleWellness' };
  const CAT_ORDER = ['cryo', 'red', 'comp', 'chair', 'iv', 'wl', 'tw'];
  const OPEN_MIN = 9 * 60, CLOSE_MIN = 19 * 60, STEP = 30;   // bookable times, spa-local

  /* ---------------- state ---------------- */
  const S = {
    gate: 'loading', gateMsg: '', gateBad: false, sentTo: '',
    tab: 'home', spas: [], svcs: [], plan: null, user: null, member: null, bookings: [], visits: [],
    bk: { step: 1, spa: null, sel: [], day: 0, slot: null, done: null, busy: false },
    busy: {}, sheet: null
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => '$' + (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
  let toastT;
  function toast(m) { clearTimeout(toastT); document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 3000); }
  const LOGO = '<svg class="logo" viewBox="-4 -32 380 140" role="img" aria-label="RKVR"><g fill="currentColor"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g><g fill="currentColor" transform="translate(96 0)"><rect x="0" y="0" width="24" height="100"/><polygon points="24,50 51.5,0 79.5,0 52,50 79.5,100 51.5,100"/></g><g transform="translate(183 0)"><polygon fill="currentColor" points="0,0 26,0 58,100 32,100"/><polygon fill="#F2542D" points="78.32,-26 104.32,-26 64,100 38,100"/></g><g fill="currentColor" transform="translate(287 0)"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g></svg>';
  const TICK = '<div class="tick"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0E1216" stroke-width="2.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';

  /* ---------------- time (spa-local) ---------------- */
  function tzParts(ts, tz) { const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(ts)).forEach(x => { if (x.type !== 'literal') p[x.type] = +x.value; }); return p; }
  function tzOffset(ts, tz) { const p = tzParts(ts, tz); return Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second) - ts; }
  function zonedToUtc(dateStr, mins, tz) { const [y, m, d] = dateStr.split('-').map(Number); const guess = Date.UTC(y, m - 1, d, 0, mins); let ts = guess - tzOffset(guess, tz); ts = guess - tzOffset(ts, tz); return new Date(ts).toISOString(); }
  function local(iso, tz) { const p = tzParts(Date.parse(iso), tz); return { date: p.year + '-' + String(p.month).padStart(2, '0') + '-' + String(p.day).padStart(2, '0'), mins: (p.hour % 24) * 60 + p.minute }; }
  const todayIn = tz => local(new Date().toISOString(), tz);
  const addDaysStr = (s, n) => { const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
  const fmtT = mins => { const h = Math.floor(mins / 60) % 24, m = mins % 60; return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
  const fmtDay = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const spaById = id => S.spas.find(s => s.id === id);
  const svcById = id => S.svcs.find(s => s.id === id);
  const isMember = () => !!(S.member && /active|past_due/.test(S.member.status));
  const covered = s => isMember() && s.member_included;

  // Next date (spa-local) a booking happens on or after today
  function nextOcc(b) {
    const sp = spaById(b.spa_id); if (!sp) return null;
    const st = local(b.starts_at, sp.time_zone), today = todayIn(sp.time_zone).date;
    let d = st.date;
    if (b.repeat === 'weekly' && d < today) d = addDaysStr(d, Math.ceil(daysBetween(d, today) / 7) * 7);
    if (b.repeat === 'monthly' && d < today) { const [y, m, dd] = d.split('-').map(Number), [ty, tm, td] = today.split('-').map(Number); let k = (ty - y) * 12 + (tm - m); if (td > dd) k++; const t = new Date(Date.UTC(y, m - 1 + k, dd)); d = t.toISOString().slice(0, 10); }
    if (b.repeat_until && d > b.repeat_until) return null;
    return d < today ? null : { date: d, mins: st.mins, today: d === today };
  }

  /* ---------------- data ---------------- */
  async function loadCatalog() {
    const [spas, svcs, plans] = await Promise.all([
      C.rest('spas?select=id,slug,name,city,state,address,time_zone,status,hours&status=in.(open,coming_soon)&order=name'),
      C.rest('services?select=id,spa_id,name,category,minutes,price_cents,member_included,sort&active=eq.true&order=sort'),
      C.rest('membership_plans?select=*&id=eq.rkvr')
    ]);
    S.spas = (spas || []).sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1));
    S.svcs = svcs || []; S.plan = plans && plans[0];
  }
  async function loadMine() {
    const [bookings, visits, mem] = await Promise.all([
      C.rest('bookings?select=id,spa_id,starts_at,repeat,repeat_until,pay_method,status,booking_items(service_id,position,minutes,price_cents)&status=in.(booked,checked_in,completed)&order=starts_at'),
      C.rest('visits?select=id,spa_id,day,booking_id,status,pay,service_ids,checked_in_at&order=checked_in_at.desc&limit=50'),
      C.rpc('my_membership_summary').catch(() => [])
    ]);
    S.bookings = bookings || []; S.visits = visits || []; S.member = mem && mem[0] || null;
  }
  const MONTHLY = () => S.plan ? S.plan.founding_price_cents || S.plan.price_cents : 9900;
  const LATER = () => S.plan ? S.plan.price_cents : 12900;
  const CUTOFF = () => S.plan && S.plan.founding_cutoff ? fmtDay(S.plan.founding_cutoff).replace(/^\w+, /, '') + ', ' + S.plan.founding_cutoff.slice(0, 4) : 'Dec 31, 2026';
  const homeSpa = () => (S.user && spaById(S.user.home_spa_id) && spaById(S.user.home_spa_id).status === 'open' ? spaById(S.user.home_spa_id) : S.spas.find(s => s.status === 'open')) || null;

  async function boot() {
    if (!C) { S.gate = 'welcome'; S.gateMsg = 'This copy isn’t connected to RKVR.'; S.gateBad = true; render(); return; }
    try { await C.verifyLink(); } catch (_) {}
    try { await loadCatalog(); } catch (e) { S.gate = 'welcome'; S.gateMsg = 'Can’t reach RKVR right now. Check your connection and try again.'; S.gateBad = true; render(); return; }
    if (C.linkError) { S.gateMsg = C.linkError; S.gateBad = true; }
    if (C.signedIn) {
      try { S.user = await C.loadProfile(); } catch (_) { S.user = null; }
    }
    if (!S.user) { S.gate = 'welcome'; render(); return; }
    S.gate = null;
    try { await loadMine(); } catch (e) { toast('Couldn’t load your visits. Pull down to retry.'); }
    if (C.linkType) toast('Welcome, ' + firstName() + '. You’re signed in.');
    render();
    if (/[?&]joined=1/.test(location.search)) {
      try { history.replaceState(null, '', location.pathname); } catch (_) {}
      S.tab = 'member'; render(); toast('Welcome to RKVR Unlimited. Starting your membership…');
      for (let i = 0; i < 8 && !isMember(); i++) { await new Promise(r => setTimeout(r, 2000)); try { await loadMine(); } catch (_) {} }
      render(); if (isMember()) toast('You’re a member. Founding rate locked in.');
    }
  }
  const firstName = () => ((S.user && S.user.full_name) || 'there').split(' ')[0];
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.user && !S.sheet) { try { await loadMine(); render(); } catch (_) {} } });

  /* ---------------- welcome / sign in ---------------- */
  function renderWelcome() {
    const msg = S.gateMsg ? `<div class="${S.gateBad ? 'err' : 'note'}" role="${S.gateBad ? 'alert' : 'status'}">${esc(S.gateMsg)}</div>` : '';
    const open = S.spas.filter(s => s.status === 'open');
    if (S.gate === 'loading') return `<div class="welcome">${LOGO}<p class="muted">Loading…</p></div>`;
    if (S.gate === 'sent') return `<div class="welcome">${LOGO}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">${TICK}<h1 class="h1">Check your email.</h1><p class="muted" style="font-size:18px">We sent a sign-in link to <b style="color:var(--fg)">${esc(S.sentTo)}</b>. Open it on this phone. It works for 24 hours.</p><p class="muted small">Not there? Check spam, or try again in a minute.</p><button class="btn" data-a="gBack">Use a different email</button></div></div>`;
    if (S.gate === 'join') return `<div class="welcome">${LOGO}<h1 class="h1">Make an account</h1><p class="muted">Book visits, check in from your phone and manage your membership. No password: we email you a link to sign in.</p>${msg}
      <form id="joinForm" style="display:flex;flex-direction:column;gap:14px">
        <label class="field">Full name<input id="jName" required autocomplete="name"></label>
        <label class="field">Email<input id="jEmail" type="email" required autocomplete="email"></label>
        <label class="field">Mobile<input id="jPhone" type="tel" required autocomplete="tel" placeholder="(619) 555-0100"></label>
        ${open.length > 1 ? `<label class="field">Home spa<select id="jSpa">${open.map(s => `<option value="${esc(s.slug)}">${esc(s.name)}</option>`).join('')}</select></label>` : ''}
        <label class="check"><input type="checkbox" id="jSms" checked><span>Text me reminders and visit updates. Reply STOP any time.</span></label>
        <button class="btn pri big" type="submit">Email me a link</button>
        <button class="link" type="button" data-a="gSignin">I already have an account</button></form></div>`;
    return `<div class="welcome">${LOGO}
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
        <span class="eyebrow">re·cov·er</span><h1 class="h1" style="font-size:64px">Your go-to for recovery and wellness.</h1>
        <p class="muted" style="font-size:18px">Book cryo, red light, compression and more at ${esc(open[0] ? 'RKVR ' + open[0].name : 'RKVR')}. Check in from your phone.</p></div>
      ${msg}
      <form id="signinForm" style="display:flex;flex-direction:column;gap:12px">
        <label class="field">Email<input id="sEmail" type="email" required autocomplete="email"></label>
        <button class="btn pri big" type="submit">Email me a sign-in link</button></form>
      <button class="btn big" data-a="gJoin">New to RKVR? Make an account</button></div>`;
  }

  /* ---------------- tabs ---------------- */
  const ICON = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
    visits: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',

  function visitCard(x, big) {

    let at = t;

        <div class="slots" role="group" aria-label="Time">${times.map(t => { const past = day === now.date && t < now.mins + 15, off = past || slotTaken(sp, day, t); return `<button data-a="slot" data-id="${t}" aria-pressed="${b.slot === t}" ${off ? 'disabled' : ''}>${fmtT(t)}</button>`; }).join('')}</div>
        ${loading ? '<p class="muted small">Checking what’s open…</p>' : ''}

      <div class="card">${its.map((s, i) => { const t = at; at += s.minutes; return `<div class="row"><span class="n">${i + 1}</span><span><b>${esc(s.name)}</b><br><span class="muted small">${fmtT(t)} · ${s.minutes} min</span></span><b class="small">${covered(s) ? 'Included' : money(s.price_cents)}</b></div>`; }).join('')}

  /* ---------------- visits / membership / account ---------------- */

      <p><span class="disp" style="font-size:56px">${money(MONTHLY())}</span><span class="muted" style="font-size:20px"> /mo</span></p>

      <div class="card">${inc.map(s => `<div class="kv"><span>${esc(s.name)}</span><span><s class="muted small">${money(s.price_cents)}</s> <b style="color:var(--ice)">Unlimited</b></span></div>`).join('')}${extra.length ? `<p class="muted small">${esc(extra.join(', '))}: paid per visit.</p>` : ''}</div>

  /* ---------------- waiver sheet ---------------- */

  function setupSig() {
    const cv = $('#sig'); if (!cv) return;
    const r = cv.getBoundingClientRect(); cv.width = Math.round(r.width); cv.height = Math.round(r.height);
    const ctx = cv.getContext('2d'); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#F2F0EA';
    let down = false, len = 0;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
    cv.onpointermove = e => { if (!down) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); len++; };
    cv.onpointerup = () => { down = false; if (len > 8 && !S.sheet.signed) { S.sheet.signed = true; const ph = document.querySelector('.sigwrap .ph'); if (ph) ph.hidden = true; sheetBtn(); } };
  }

  /* ---------------- actions ---------------- */

    if (r && r.error === 'not_today') { toast('You can check in on the day of your visit.'); return; }
    if (r && r.error) { toast('That visit can’t be checked in. Ask the front desk.'); return; }
    if (waiver) S.user.waiver_signed_at = new Date().toISOString();
    S.sheet = null; await loadMine(); render(); toast('You’re checked in. Welcome!'); window.scrollTo({ top: 0 });
  }
  const A = {
    gJoin: () => { S.gate = 'join'; S.gateMsg = ''; render(); },

    day: i => { S.bk.day = +i; S.bk.slot = null; render(); },

    bkAgain: () => { S.bk = { step: 1, spa: S.bk.spa, sel: [], day: 0, slot: null, done: null }; render(); window.scrollTo({ top: 0 }); },
    bkConfirm: async () => {
      const b = S.bk, sp = bkSpa(), day = bkDays()[b.day], its = b.sel.map(svcById), mem = isMember();
      b.busy = true; render();
      let at = b.slot; const items = its.map((s, i) => { const it = { service_id: s.id, position: i + 1, starts_at: zonedToUtc(day, at, sp.time_zone), minutes: s.minutes, price_cents: s.price_cents, uses_member_service: mem && s.member_included }; at += s.minutes; return it; });
      const due = its.reduce((a, s) => a + (mem && s.member_included ? 0 : s.price_cents), 0);
      let created = null;
      try {
        const rows = await C.rest('bookings', { method: 'POST', prefer: 'return=representation', body: { client_id: S.user.id, spa_id: sp.id, starts_at: items[0].starts_at, repeat: 'once', pay_method: mem ? 'member' : 'card', status: 'booked', deposit_cents: 0, balance_cents: due } });
        created = rows[0];
        await C.rest('booking_items', { method: 'POST', prefer: 'return=minimal', body: items.map(it => Object.assign({ booking_id: created.id }, it)) });
        delete S.busy[sp.slug + '|' + day];
        await loadMine();
        S.bk.done = { title: its.map(s => s.name).join(' + '), day, mins: b.slot, spa: sp.name };
      } catch (e) {
        if (created) { try { await C.rpc('cancel_booking', { booking: created.id }); } catch (_) {} }
        toast('Couldn’t book that time: ' + e.message);
      }
      b.busy = false; render(); window.scrollTo({ top: 0 });
    },
    cancel: async (id, el) => {
      if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Tap again to cancel'; setTimeout(() => { if (el.isConnected) { el.dataset.sure = ''; el.textContent = 'Cancel visit'; } }, 4000); return; }
      try { await C.rpc('cancel_booking', { booking: id }); await loadMine(); render(); toast('Visit cancelled'); }
      catch (e) { toast('Couldn’t cancel: ' + e.message); }
    },
    join: async (id, el) => {
      el.disabled = true; el.textContent = 'Opening secure checkout…';
      try { const r = await C.callFn('membership-checkout', { return_url: location.origin + location.pathname }); location.href = r.url; }
      catch (e) { el.disabled = false; el.textContent = 'Join for ' + money(MONTHLY()) + '/mo'; toast(e.message); if (e.code === 'already_member') { await loadMine(); render(); } }
    },
    portal: async (id, el) => {
      el.disabled = true;
      try { const r = await C.callFn('billing-portal', { return_url: location.origin + location.pathname }); location.href = r.url; }
      catch (e) { el.disabled = false; toast(e.message); }
    },
    checkIn: async id => { try { await doCheckIn(id, false); } catch (e) { toast(e.message); } },
    sheetClose: () => { S.sheet = null; render(); },
    sigClear: () => { S.sheet.signed = false; render(); },
    waiverGo: async () => { const sh = S.sheet; sh.busy = true; sheetBtn(); try { await doCheckIn(sh.id, true); } catch (e) { sh.busy = false; sheetBtn(); toast(e.message); } }
  };

  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; if (S.tab === 'book' && S.bk.done) S.bk = { step: 1, spa: S.bk.spa, sel: [], day: 0, slot: null, done: null }; render(); window.scrollTo({ top: 0 }); return; }
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    if (b.dataset.a === 'sheetClose' && b.classList.contains('sheet-scrim') && e.target.closest('[data-stop]')) return;
    const fn = A[b.dataset.a]; if (fn) fn(b.dataset.id, b);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'wAgree') { S.sheet.agree = e.target.checked; sheetBtn(); }
    if (e.target.id === 'bkSpa') { S.bk = { step: 1, spa: e.target.value, sel: [], day: 0, slot: null, done: null }; render(); }
  });
  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button[type=submit]');
    if (f.id === 'signinForm' || f.id === 'joinForm') {
      const join = f.id === 'joinForm';
      const email = $(join ? '#jEmail' : '#sEmail').value.trim();
      const data = join ? { full_name: $('#jName').value.trim(), phone: $('#jPhone').value.trim(), sms_opt_in: $('#jSms').checked, home_spa: $('#jSpa') ? $('#jSpa').value : (S.spas.find(s => s.status === 'open') || {}).slug } : {};
      btn.disabled = true; btn.textContent = 'Sending…';
      try { await C.sendLink(email, data, ''); S.gate = 'sent'; S.sentTo = email; S.gateMsg = ''; }
      catch (err) { S.gateMsg = err.status === 429 ? 'Too many emails just now. Try again in a minute.' : 'Couldn’t send the link: ' + err.message; S.gateBad = true; }
      render(); return;
    }
    if (f.id === 'meForm') {
      btn.disabled = true;
      try {
        S.user = await C.updateProfile({ full_name: $('#mName').value.trim(), phone: $('#mPhone').value.trim(), sms_opt_in: $('#mSms').checked, home_spa_id: $('#mSpa') ? $('#mSpa').value : S.user.home_spa_id });
        toast('Saved');
      } catch (err) { toast('Couldn’t save: ' + err.message); }
      render();
    }
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render(); boot();
})();
</script>
</body>
</html>
