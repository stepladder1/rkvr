<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RKVR Pro">
<meta name="theme-color" content="#0E1216">
<title>RKVR Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* RKVR Pro on the operator's phone: the Check-In's Pro side, plus the week ahead and the client list. */
:root { --bg:#0E1216; --panel:#182027; --panel2:#1F2830; --line:rgba(242,240,234,.12); --line2:rgba(242,240,234,.26); --fg:#F2F0EA; --muted:#A9B1B8; --soft:#C9CFD4; --accent:#F2542D; --accentText:#FF7A57; --ink:#0E1216; --ice:#7CCBFF; --iceBg:rgba(124,203,255,.12); --iceLine:rgba(124,203,255,.4); --accBg:rgba(242,84,45,.14);
  --display:'Big Shoulders Display','Arial Narrow',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { overflow-x: hidden; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px; border-bottom: 1px solid var(--line); }
.logo { height: 22px; width: auto; display: block; color: var(--fg); flex-shrink: 0; }
.protag { padding: 2px 6px; border: 1px solid var(--line2); color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; }
.spasel { margin-left: auto; background: transparent; border: 0; font: 800 18px/1 var(--display); text-transform: uppercase; color: var(--fg); max-width: 55%; text-align: right; }
.spasel option { background: var(--panel); font: 600 14px var(--body); }
main { flex: 1; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 96px); display: flex; flex-direction: column; gap: 14px; }
.disp { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; }
.h1 { font: 800 44px/.92 var(--display); text-transform: uppercase; }
.h2 { font: 800 24px/1 var(--display); text-transform: uppercase; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accentText); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.btn { min-height: 46px; padding: 0 16px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.btn.big { min-height: 54px; font-size: 16.5px; width: 100%; }
.btn:disabled { background: var(--panel2); border-color: var(--panel2); color: var(--muted); }
.link { background: none; border: 0; color: var(--accentText); font-weight: 700; padding: 8px 0; }
.chip { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; border: 1px solid var(--line2); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.arr { display: grid; grid-template-columns: 84px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.arr .t { font: 800 18px/1 var(--display); white-space: nowrap; }
.arr > span { min-width: 0; overflow: hidden; }
.arr .nm { font-weight: 700; }
.arr .sub { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vrow .n { font: 800 20px/1 var(--display); color: var(--accentText); }
.paybox { background: var(--panel2); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.note { padding: 10px 12px; border-left: 3px solid var(--ice); background: var(--iceBg); font-size: 14px; }
.warn { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accBg); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border: 1px solid var(--line2); }
.seg button { height: 44px; border: 0; background: transparent; font-weight: 700; font-size: 13.5px; }
.seg button.on { background: var(--accent); color: var(--ink); }
.pick { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); }
.pick:disabled { opacity: .4; }
.cb { width: 24px; height: 24px; border: 2px solid var(--line2); color: var(--ink); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 700; }
.field input, .field select { min-height: 48px; padding: 0 12px; border: 1px solid var(--line2); background: var(--panel); font-size: 16px; font-weight: 500; }
.field input:focus { outline: none; border-color: var(--accent); }
.rooms { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.room { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.room b { font: 800 16px/1 var(--display); text-transform: uppercase; }
.room span { font-size: 13px; font-weight: 700; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.days button { flex: 0 0 58px; height: 66px; border: 1px solid var(--line2); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.days button b { font: 800 24px/1 var(--display); }
.days button span { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.days button i { font-style: normal; font-size: 11px; color: var(--accentText); font-weight: 700; }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.days button[aria-pressed="true"] span, .days button[aria-pressed="true"] i { color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line2); padding: 0 12px; min-height: 48px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 16px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: rgba(14,18,22,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); }
.bar button { height: 62px; background: none; border: 0; color: var(--muted); font-size: 11.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.bar button[aria-current="page"] { color: var(--accentText); }
.bar svg { width: 22px; height: 22px; }
.fab { position: fixed; right: max(18px, calc(50% - 262px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 4; height: 52px; padding: 0 20px; background: var(--accent); color: var(--ink); border: 0; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(5,8,10,.75); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-top: 1px solid var(--line2); padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); transform: translateX(-50%); background: var(--fg); color: var(--ink); padding: 12px 18px; font-weight: 700; z-index: 20; max-width: calc(100% - 40px); text-align: center; }
.gate { min-height: 100vh; min-height: 100dvh; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.gate .logo { align-self: flex-start; height: 26px; }
.gmsg { padding: 12px 14px; border-left: 3px solid var(--ice); background: var(--iceBg); font-size: 15px; }
.gmsg.bad { border-color: var(--accent); background: var(--accBg); }
.offline { position: fixed; top: 0; left: 0; right: 0; background: var(--accent); color: var(--ink); text-align: center; font-weight: 700; font-size: 13px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 4px 4px; z-index: 30; }
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
(function () {
  const C = window.RKVR_CLOUD;
  const MAX = 3, POLL = 20000, SPA_KEY = 'rkvr-pro-spa';
  const ROOM = { cryo: 'Cryo Chamber', red: 'Red Light Bed', comp: 'Compression', chair: 'Massage Chair', iv: 'IV Lounge', wl: 'Consult Room', tw: 'Consult Room' };

  const S = {
    gate: 'loading', gateMsg: '', gateBad: false,
    tab: 'today', spas: [], spa: null, svcs: [], visits: [], bookings: [], people: {}, allVisits: [],
    weekDay: 0, q: '', sheet: null, busy: false, offline: false,
    wi: { sel: [], pay: 'alacarte', name: '', phone: '' }
  };
  let pollT, toastT;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => '$' + (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
  const fmtPhone = d => { d = String(d || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : d; };
  function toast(m) { clearTimeout(toastT); document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 3000); }
  const LOGO = '<svg class="logo" viewBox="-4 -32 380 140" role="img" aria-label="RKVR"><g fill="currentColor"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g><g fill="currentColor" transform="translate(96 0)"><rect x="0" y="0" width="24" height="100"/><polygon points="24,50 51.5,0 79.5,0 52,50 79.5,100 51.5,100"/></g><g transform="translate(183 0)"><polygon fill="currentColor" points="0,0 26,0 58,100 32,100"/><polygon fill="#F2542D" points="78.32,-26 104.32,-26 64,100 38,100"/></g><g fill="currentColor" transform="translate(287 0)"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g></svg>';

  /* ---------------- time ---------------- */
  const tz = () => (S.spa && S.spa.time_zone) || 'America/Los_Angeles';
  function tzParts(ts, z) { const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: z, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(ts)).forEach(x => { if (x.type !== 'literal') p[x.type] = +x.value; }); return p; }
  function local(iso) { const p = tzParts(Date.parse(iso), tz()); return { date: p.year + '-' + String(p.month).padStart(2, '0') + '-' + String(p.day).padStart(2, '0'), mins: (p.hour % 24) * 60 + p.minute }; }
  const today = () => local(new Date().toISOString()).date;
  const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
  const fmtT = mins => { const h = Math.floor(mins / 60) % 24, m = mins % 60; return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
  const tfmt = iso => fmtT(local(iso).mins);
  const fmtDay = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  function occursOn(b, day) {
    const st = local(b.starts_at), d0 = st.date;
    if (d0 > day || (b.repeat_until && day > b.repeat_until)) return false;
    if (b.repeat === 'once') return d0 === day;
    if (b.repeat === 'weekly') return daysBetween(d0, day) % 7 === 0;
    return d0.slice(8) === day.slice(8);
  }

  /* ---------------- helpers ---------------- */
  const svcById = id => S.svcs.find(s => s.id === id);
  const covers = (pay, it) => (pay === 'member' || pay === 'join') && it.member_included;
  const dueOf = (pay, its) => its.reduce((a, it) => a + (covers(pay, it) ? 0 : it.price_cents), 0);
  const items = v => v.items || [];
  const payShort = p => p === 'member' ? 'Member' : p === 'join' ? 'New member' : 'À la carte';
  const META = { booked: ['Booked', '', ''], waiver: ['Needs waiver', 'rgba(242,84,45,.16)', 'var(--accentText)'], checked_in: ['Here', 'rgba(124,203,255,.14)', 'var(--ice)'], in_room: ['In room', 'var(--accent)', 'var(--ink)'], done: ['Checked out', '', 'var(--muted)'], no_show: ['No-show', '', 'var(--muted)'] };
  const needsWaiver = v => v.status === 'booked' && !v.waiver;
  const chip = v => { const m = META[needsWaiver(v) ? 'waiver' : v.status] || META.booked; return `<span class="chip" style="${m[1] ? 'background:' + m[1] + ';border-color:transparent;' : ''}${m[2] ? 'color:' + m[2] : ''}">${m[0]}</span>`; };

  /* ---------------- data ---------------- */
  async function loadSpa() {
    const id = S.spa.id;
    S.svcs = await C.rest('services?select=id,name,category,minutes,price_cents,member_included,sort&active=is.true&spa_id=eq.' + id + '&order=sort') || [];
    await Promise.all([refreshToday(), loadWeek(), loadClients()]);
  }
  async function refreshToday() {
    try { const d = await C.rpc('desk_today', { spa_slug: S.spa.slug }); S.visits = (d && d.visits) || []; S.offline = false; }
    catch (e) { S.offline = true; if (e.status === 401) { S.gate = 'login'; S.gateMsg = 'You’ve been signed out. Sign in again.'; S.gateBad = true; } }
  }
  async function loadWeek() {
    S.bookings = await C.rest('bookings?select=id,starts_at,repeat,repeat_until,pay_method,status,note,client_id,client:client_id(full_name,phone),booking_items(service_id,position,minutes,price_cents)&spa_id=eq.' + S.spa.id + '&status=in.(booked,checked_in,completed)&order=starts_at') || [];
  }
  async function loadClients() {
    const vis = await C.rest('visits?select=client_id,day,status&spa_id=eq.' + S.spa.id + '&client_id=not.is.null&order=day.desc&limit=2000') || [];
    S.allVisits = vis;
    const ids = Array.from(new Set(S.bookings.map(b => b.client_id).concat(vis.map(v => v.client_id)))).filter(Boolean);
    const filt = ids.length ? 'or=(home_spa_id.eq.' + S.spa.id + ',id.in.(' + ids.join(',') + '))' : 'home_spa_id=eq.' + S.spa.id;
    const rows = await C.rest('profiles?select=id,full_name,email,phone,role,waiver_signed_at,created_at,memberships(status,rate_cents,is_founding,started_at)&' + filt) || [];
    S.people = {}; rows.filter(p => p.role === 'client').forEach(p => { S.people[p.id] = p; });
  }
  async function tick() {
    if (!S.spa || S.busy || document.hidden) return;
    await refreshToday();
    const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName);
    if (!typing && !S.sheet) render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  async function act(fn, okMsg) {
    if (S.busy) return false;
    S.busy = true;
    try { const r = await fn(); if (okMsg) toast(okMsg); await refreshToday(); return r == null ? true : r; }
    catch (e) { toast(e.message || 'Something went wrong. Try again.'); return false; }
    finally { S.busy = false; }
  }

  /* ---------------- gate ---------------- */
  function renderGate() {
    const msg = S.gateMsg ? `<div class="gmsg ${S.gateBad ? 'bad' : ''}" role="${S.gateBad ? 'alert' : 'status'}">${esc(S.gateMsg)}</div>` : '';
    let body;
    if (S.gate === 'loading') body = '<p class="muted">Loading…</p>';
    else if (S.gate === 'continue') body = `<h1 class="h1">Welcome to RKVR Pro</h1><p class="muted">Tap Continue to finish signing in.</p><button class="btn pri big" data-a="gContinue">Continue</button>`;
    else if (S.gate === 'noaccess') body = `<h1 class="h1">No Pro access</h1>${msg}<p class="muted">This account isn’t set up as a spa operator. Ask RKVR HQ to add you on the Team page, then sign in again.</p><button class="btn big" data-a="signOut">Sign out</button>`;
    else if (S.gate === 'nospa') body = `<h1 class="h1">No spa yet</h1><p class="muted">You’re signed in, but no RKVR spa is assigned to you yet. Ask RKVR HQ to pick your spa on the Team page.</p><button class="btn big" data-a="signOut">Sign out</button>`;
    else body = `<span class="eyebrow">For RKVR spa operators</span><h1 class="h1" style="font-size:56px">Run your spa.</h1><p class="muted" style="font-size:17px">Today’s arrivals, the week ahead and your clients, on your phone.</p>${msg}
      <form id="gForm" style="display:flex;flex-direction:column;gap:12px">
        <label class="field">Email<input id="gEmail" type="email" autocomplete="username" required></label>
        <label class="field">Password <span class="muted" style="font-weight:500">(optional)</span><input id="gPass" type="password" autocomplete="current-password"></label>
        <button class="btn pri big" type="submit">Sign in</button>
        <p class="muted small">No password? Leave it blank and we’ll email you a sign-in link.</p></form>`;
    return `<div class="gate">${LOGO}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">${body}</div></div>`;
  }
  async function boot() {
    if (!C) { S.gate = 'login'; S.gateMsg = 'This copy isn’t connected to RKVR.'; S.gateBad = true; render(); return; }
    if (C.pendingLink) { S.gate = 'continue'; render(); return; }
    let p = null;
    try { p = await C.loadProfile(); } catch (e) { S.gate = 'login'; S.gateMsg = 'Can’t reach RKVR right now. Check your connection.'; S.gateBad = true; render(); return; }
    if (!p) { S.gate = 'login'; render(); return; }
    if (p.role !== 'operator' && p.role !== 'hq_admin') { S.gate = 'noaccess'; render(); return; }
    const spas = await C.rest('spas?select=id,slug,name,time_zone,status&order=name' + (p.role === 'hq_admin' ? '' : '&operator_id=eq.' + p.id));
    S.spas = (spas || []).sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1));
    if (!S.spas.length) { S.gate = 'nospa'; render(); return; }
    let saved = null; try { saved = localStorage.getItem(SPA_KEY); } catch (_) {}
    S.spa = S.spas.find(s => s.slug === saved) || S.spas[0];
    S.gate = null; render();
    const q = new URLSearchParams(location.search);
    if (q.has('paid') || q.has('joined')) { try { history.replaceState(null, '', location.pathname); } catch (_) {} toast(q.has('joined') ? 'Membership payment received. Welcome to RKVR!' : 'Payment received ✓'); }
    try { await loadSpa(); } catch (e) { toast('Couldn’t load everything: ' + e.message); }
    render();
    clearInterval(pollT); pollT = setInterval(tick, POLL);
  }

  /* ---------------- views ---------------- */
  const ICON = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    clients: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.8 5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
  };
  const TABS = [['today', 'Today'], ['week', 'Week'], ['clients', 'Clients'], ['more', 'More']];
  function renderApp() {
    const spaPick = S.spas.length > 1 ? `<label class="spasel-wrap" style="margin-left:auto"><span hidden>Spa</span><select class="spasel" id="spaSel">${S.spas.map(s => `<option value="${esc(s.slug)}" ${s.slug === S.spa.slug ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : `<span class="spasel">${esc(S.spa.name)}</span>`;

      ${S.tab === 'today' ? `<button class="fab" data-a="walkin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Walk-in</button>` : ''}
      <div class="bar"><nav aria-label="Main">${TABS.map(([id, n]) => `<button data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${ICON[id]}${n}</button>`).join('')}</nav></div>
      ${S.sheet ? `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">${S.sheet.type === 'visit' ? sheetVisit() : S.sheet.type === 'walkin' ? sheetWalkin() : sheetClient()}</div></div>` : ''}`;
  }
  function vToday() {
    const all = S.visits, count = k => all.filter(v => v.status === k).length;
    const busy = {}; all.forEach(v => { if (v.status === 'in_room' && items(v)[0]) busy[ROOM[items(v)[0].category]] = v.name.split(' ')[0]; });
    const rooms = Array.from(new Set(S.svcs.map(s => ROOM[s.category]).filter(Boolean)));
    const active = all.filter(v => v.status !== 'done' && v.status !== 'no_show'), finished = all.filter(v => v.status === 'done' || v.status === 'no_show');
    const row = v => `<button class="arr" data-a="open" data-id="${esc(v.key)}"><span class="t">${v.walk_in ? '<span style="font-size:11px;color:var(--accentText)">WALK-IN</span><br>' : ''}${tfmt(v.starts_at)}</span><span style="min-width:0"><span class="nm">${esc(v.name)}</span> <span class="muted small">· ${payShort(v.pay)}</span><br><span class="sub">${esc(items(v).map(i => i.name).join(' + '))}</span></span>${chip(v)}</button>`;
    return `<div><span class="eyebrow">${esc(fmtDay(today()))}</span><h1 class="h1" style="margin-top:6px">Today</h1></div>
      <div class="counts"><span class="chip">${count('booked')} booked</span><span class="chip" style="background:rgba(124,203,255,.14);color:var(--ice);border-color:transparent">${count('checked_in')} here</span><span class="chip" style="background:rgba(242,84,45,.16);color:var(--accentText);border-color:transparent">${count('in_room')} in room</span><span class="chip" style="color:var(--muted)">${finished.length} done</span></div>
      ${active.length ? active.map(row).join('') : `<div class="card"><p class="muted">${all.length ? 'Everyone’s been seen. Nice work.' : 'No bookings yet today. Website and app bookings show up here, and you can add walk-ins.'}</p></div>`}
      ${rooms.length ? `<h2 class="h2" style="margin-top:6px">Rooms</h2><div class="rooms">${rooms.map(r => `<div class="room" style="border-top:3px solid ${busy[r] ? 'var(--accent)' : 'var(--ice)'}"><b>${r}</b><span style="color:${busy[r] ? 'var(--accentText)' : 'var(--ice)'}">${busy[r] ? 'With ' + esc(busy[r]) : 'Open'}</span></div>`).join('')}</div>` : ''}
      ${finished.length ? `<h2 class="h2" style="margin-top:6px">Done today</h2>${finished.map(row).join('')}` : ''}`;
  }
  function sheetVisit() {
    const v = S.visits.find(x => x.key === S.sheet.id);
    if (!v) return `<p class="muted">That visit isn’t on today’s list any more.</p><button class="btn big" data-a="close">Close</button>`;
    const its = items(v), due = dueOf(v.pay, its);
    const labels = { booked: 'Check in', checked_in: 'Send to room', in_room: due && !v.paid ? 'Check out · collected ' + money(due) : 'Check out' };
    const can = labels[v.status] && !needsWaiver(v);
    return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><span class="eyebrow">${v.first_visit && !v.walk_in ? 'First visit · ' : ''}${payShort(v.pay)}</span><h2 class="h1" style="font-size:38px;margin-top:4px">${esc(v.name)}</h2>${v.phone ? `<a class="muted small" href="tel:${esc(v.phone)}" style="color:var(--muted)">${fmtPhone(v.phone)}</a>` : ''}</div>${chip(v)}</div>
      <div>${its.map((it, i) => `<div class="vrow"><span class="n">${i + 1}</span><span><b style="font-weight:600">${esc(it.name)}</b><br><span class="muted small">${it.starts_at ? tfmt(it.starts_at) + ' · ' : ''}${ROOM[it.category] || ''} · ${it.minutes} min</span></span><b class="small">${covers(v.pay, it) ? 'Included' : money(it.price_cents)}</b></div>`).join('')}</div>
      <div class="paybox"><span><b class="small">${v.paid ? 'Paid' : due ? 'Collect at checkout' : 'Covered by membership'}</b></span><span class="disp" style="font-size:26px">${v.paid ? '$0' : money(due)}</span></div>
      ${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}
      ${needsWaiver(v) ? `<div class="warn"><span><b class="small">Waiver not signed</b><br><span class="small" style="color:var(--soft)">They can sign on the desk iPad or in the RKVR app.</span></span><button class="btn" data-a="waiver">Mark signed</button></div>` : ''}
      ${due && !v.paid && /booked|checked_in|in_room/.test(v.status) && !needsWaiver(v) ? `<button class="btn big" data-a="payCard" style="border-color:var(--ice);color:var(--ice)">Take card payment · ${money(due)}</button>` : ''}
      ${can ? `<button class="btn pri big" data-a="advance">${labels[v.status]}</button>` : ''}
      ${v.status === 'booked' && !v.walk_in ? `<button class="btn big" data-a="noShow">Mark no-show</button>` : ''}
      <button class="btn big" data-a="close">Close</button>`;
  }
  function sheetWalkin() {
    const W = S.wi, its = W.sel.map(svcById).filter(Boolean), due = dueOf(W.pay, its), n = its.length;
    const cta = !n ? 'Pick a service' : W.pay === 'alacarte' ? 'Check in · ' + money(due) + ' due' : W.pay === 'join' ? 'Check in and take membership payment' : 'Check in member';
    return `<div style="display:flex;justify-content:space-between;align-items:baseline"><div><span class="eyebrow">New walk-in</span><h2 class="h1" style="font-size:34px">Pick up to ${MAX}</h2></div><button class="link" data-a="close">Cancel</button></div>
      <div class="seg" role="group" aria-label="How they pay">${[['alacarte', 'À la carte'], ['member', 'Member'], ['join', 'Join']].map(p => `<button class="${W.pay === p[0] ? 'on' : ''}" aria-pressed="${W.pay === p[0]}" data-a="wiPay" data-id="${p[0]}">${p[1]}</button>`).join('')}</div>
      ${W.pay === 'member' ? '' : `<label class="field">Name<input id="wiName" value="${esc(W.name)}" autocomplete="off" placeholder="First and last"></label>`}
      <label class="field">${W.pay === 'member' ? 'Member’s mobile' : 'Mobile (optional)'}<input id="wiPhone" type="tel" value="${esc(W.phone)}" autocomplete="off" placeholder="(619) 555-0142"></label>
      ${W.pay === 'join' ? `<label class="field">Email (their membership account)<input id="wiEmail" type="email" value="${esc(W.email || '')}" autocomplete="off" placeholder="name@example.com"></label>` : ''}
      <div>${S.svcs.map(s => { const i = W.sel.indexOf(s.id), on = i >= 0; return `<button class="pick" data-a="wiToggle" data-id="${s.id}" aria-pressed="${on}" ${!on && n >= MAX ? 'disabled' : ''}><span class="cb ${on ? 'on' : ''}">${on ? i + 1 : ''}</span><span><b style="font-weight:600;font-size:15px">${esc(s.name)}</b><br><span class="muted small">${s.minutes} min</span></span><b class="small">${covers(W.pay, s) ? 'Included' : money(s.price_cents)}</b></button>`; }).join('')}</div>
      <button class="btn pri big" data-a="addWalk" ${n ? '' : 'disabled'}>${cta}</button>`;
  }
  function weekRows(day) {
    return S.bookings.filter(b => occursOn(b, day)).map(b => ({ b, mins: local(b.starts_at).mins })).sort((x, y) => x.mins - y.mins);
  }
  function vWeek() {
    const t = today(), days = Array.from({ length: 7 }, (_, i) => addDays(t, i)), day = days[S.weekDay];
    const rows = weekRows(day);
    return `<h1 class="h1">This week</h1>
      <div class="days" role="group" aria-label="Day">${days.map((d, i) => { const n = weekRows(d).length, dt = new Date(d + 'T12:00:00Z'); return `<button data-a="wday" data-id="${i}" aria-pressed="${i === S.weekDay}"><span>${i === 0 ? 'Today' : dt.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })}</span><b>${dt.getUTCDate()}</b><i>${n || ''}</i></button>`; }).join('')}</div>
      <p class="muted small">${esc(fmtDay(day))} · ${rows.length} ${rows.length === 1 ? 'visit' : 'visits'}</p>
      ${rows.length ? rows.map(({ b, mins }) => { const its = (b.booking_items || []).slice().sort((x, y) => x.position - y.position).map(i => svcById(i.service_id)).filter(Boolean); const c = b.client || {}; return `<button class="arr" data-a="client" data-id="${esc(b.client_id)}"><span class="t">${fmtT(mins)}</span><span style="min-width:0"><span class="nm">${esc(c.full_name || 'Client')}</span> <span class="muted small">· ${b.pay_method === 'member' ? 'Member' : 'À la carte'}</span><br><span class="sub">${esc(its.map(s => s.name).join(' + '))}</span></span>${b.repeat !== 'once' ? `<span class="chip">${b.repeat === 'weekly' ? 'Weekly' : 'Monthly'}</span>` : '<span></span>'}</button>`; }).join('') : '<div class="card"><p class="muted">Nothing booked this day yet.</p></div>'}`;
  }
  const memOf = p => (p.memberships || []).find(m => /active|past_due|paused/.test(m.status));
  function clientStats(id) { const v = S.allVisits.filter(x => x.client_id === id && x.status === 'done'); return { n: v.length, last: v[0] && v[0].day }; }
  function vClients() {
    const q = S.q.toLowerCase(), qd = q.replace(/\D/g, '');
    const list = Object.values(S.people).map(p => Object.assign({ m: memOf(p) }, p, clientStats(p.id)))
      .filter(p => !q || (p.full_name || '').toLowerCase().includes(q) || (p.email || '').toLowerCase().includes(q) || (qd && (p.phone || '').replace(/\D/g, '').includes(qd)))
      .sort((a, b) => (b.last || '').localeCompare(a.last || '') || (a.full_name || '').localeCompare(b.full_name || ''));
    const members = Object.values(S.people).filter(p => memOf(p)).length;
    return `<h1 class="h1">Clients</h1>
      <div class="counts"><span class="chip">${Object.keys(S.people).length} clients</span><span class="chip" style="background:rgba(242,84,45,.16);color:var(--accentText);border-color:transparent">${members} members</span></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B1B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span hidden>Search clients</span><input id="q" type="search" placeholder="Name, phone or email" value="${esc(S.q)}" autocomplete="off"></label>
      ${list.length ? list.map(p => `<button class="arr" data-a="client" data-id="${esc(p.id)}" style="grid-template-columns:minmax(0,1fr) auto"><span style="min-width:0"><span class="nm">${esc(p.full_name || p.email || 'Client')}</span><br><span class="sub">${p.n ? p.n + (p.n === 1 ? ' visit' : ' visits') + ' · last ' + esc(fmtDay(p.last)) : 'No visits yet'}</span></span>${p.m ? '<span class="chip" style="background:var(--accent);color:var(--ink);border-color:transparent">Member</span>' : '<span class="chip">À la carte</span>'}</button>`).join('') : `<div class="card"><p class="muted">${q ? 'No one matches that search.' : 'Clients show up here once they book or call this spa home.'}</p></div>`}`;
  }
  function sheetClient() {
    const p = S.people[S.sheet.id];
    if (!p) return `<p class="muted">We couldn’t load that client.</p><button class="btn big" data-a="close">Close</button>`;
    const m = memOf(p), st = clientStats(p.id), t = today();
    const next = S.bookings.filter(b => b.client_id === p.id).map(b => { for (let i = 0; i < 60; i++) { const d = addDays(t, i); if (occursOn(b, d)) return { d, mins: local(b.starts_at).mins, b }; } return null; }).filter(Boolean).sort((a, b) => (a.d + a.mins).localeCompare(b.d + b.mins))[0];
    return `<div><span class="eyebrow">${m ? 'Unlimited member' : 'À la carte'}</span><h2 class="h1" style="font-size:38px;margin-top:4px">${esc(p.full_name || 'Client')}</h2></div>
      <div class="card" style="gap:0">
        ${p.phone ? `<div class="kv"><span class="muted">Mobile</span><a href="tel:${esc(p.phone)}" style="color:var(--fg);font-weight:700">${fmtPhone(p.phone)}</a></div>` : ''}
        ${p.email ? `<div class="kv"><span class="muted">Email</span><a href="mailto:${esc(p.email)}" style="color:var(--fg)">${esc(p.email)}</a></div>` : ''}
        <div class="kv"><span class="muted">Membership</span><b>${m ? money(m.rate_cents) + '/mo' + (m.is_founding ? ' · founding' : '') + (m.status !== 'active' ? ' · ' + m.status.replace('_', ' ') : '') : 'None'}</b></div>
        <div class="kv"><span class="muted">Waiver</span><b>${p.waiver_signed_at ? 'Signed' : 'Not signed'}</b></div>
        <div class="kv"><span class="muted">Visits here</span><b>${st.n}${st.last ? ' · last ' + esc(fmtDay(st.last)) : ''}</b></div>
        <div class="kv"><span class="muted">Next visit</span><b>${next ? esc(fmtDay(next.d)) + ' · ' + fmtT(next.mins) : 'None booked'}</b></div>
        <div class="kv"><span class="muted">Client since</span><b>${p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : ''}</b></div>
      </div>
      ${p.phone ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a class="btn" href="tel:${esc(p.phone)}">Call</a><a class="btn" href="sms:${esc(p.phone)}">Text</a></div>` : ''}
      <button class="btn big" data-a="close">Close</button>`;
  }
  function vMore() {
    const u = C.profile || {};
    return `<h1 class="h1">More</h1>
      <div class="card" style="gap:0"><div class="kv"><span class="muted">Signed in as</span><b>${esc(u.full_name || u.email || '')}</b></div><div class="kv"><span class="muted">Role</span><b>${u.role === 'hq_admin' ? 'RKVR HQ' : 'Spa operator'}</b></div><div class="kv"><span class="muted">Spa</span><b>${esc(S.spa.name)}</b></div></div>
      <a class="btn big" href="https://rkvrcheckin.netlify.app" target="_blank" rel="noopener">Open the front-desk Check-In</a>
      <button class="btn big" data-a="reload">Refresh everything</button>
      <div class="note">Coming next to RKVR Pro: payouts, rent, supply orders and messages to clients.</div>
      <button class="btn big" data-a="signOut">Sign out</button>`;
  }

  // Stripe's secure page opens on this phone for the client to enter their card; it comes back here after
  async function toStripe(fn, args, el) {
    if (el) { el.disabled = true; el.textContent = 'Opening secure checkout…'; }
    try { const r = await C.callFn(fn, Object.assign({ return_url: location.origin + location.pathname }, args)); location.href = r.url; }
    catch (e) { if (el) { el.disabled = false; el.textContent = 'Try again'; } toast(e.code === 'paid' ? 'That visit is already paid.' : e.message); }
  }

  /* ---------------- render + actions ---------------- */
  function render() { $('#root').innerHTML = S.gate ? renderGate() : renderApp(); }
  const cur = () => S.visits.find(x => x.key === (S.sheet && S.sheet.id));
  const A = {
    gContinue: async () => { try { await C.verifyLink(); } catch (e) { S.gate = 'login'; S.gateMsg = e.message; S.gateBad = true; render(); return; } boot(); },
    signOut: async () => { await C.signOut(); location.reload(); },
    reload: async () => { await loadSpa(); render(); toast('Up to date'); },
    open: id => { S.sheet = { type: 'visit', id }; render(); },
    client: id => { if (!S.people[id]) { toast('No details for this client yet'); return; } S.sheet = { type: 'client', id }; render(); },
    close: () => { S.sheet = null; render(); },
    walkin: () => { S.wi = { sel: [], pay: 'alacarte', name: '', phone: '' }; S.sheet = { type: 'walkin' }; render(); },
    wiPay: id => { S.wi.pay = id; render(); },
    wiToggle: id => { const a = S.wi.sel, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else if (a.length < MAX) a.push(id); render(); },
    addWalk: async () => {
      const W = S.wi, ph = W.phone.replace(/\D/g, '').slice(-10);
      if (W.pay === 'member' && ph.length !== 10) { toast('Enter the member’s 10-digit mobile'); return; }
      if (W.pay !== 'member' && !W.name.trim()) { toast('Add their name'); return; }
      if (W.pay === 'join' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(W.email || '')) { toast('Add their email for the membership'); return; }
      const r = await act(() => C.rpc('desk_walk_in', { spa_slug: S.spa.slug, p_services: W.sel, p_pay: W.pay, p_phone: ph || null, p_name: W.name.trim() || null, p_source: 'desk', p_waiver: false }));
      if (!r) return;
      if (r.error === 'no_member') { toast('No active membership for that number'); return; }
      toast(r.name + ' is checked in'); S.sheet = { type: 'visit', id: 'v:' + r.visit_id }; render();
      if (W.pay === 'join') await toStripe('membership-checkout', { for: { name: W.name.trim(), email: W.email, phone: ph, spa_id: S.spa.id, visit_id: r.visit_id } });
    },
    waiver: async () => { const v = cur(); if (v) { await act(() => C.rpc('desk_waiver', { p_booking: v.booking_id }), 'Waiver marked signed'); render(); } },
    advance: async () => {
      const v = cur(); if (!v) return;
      const due = dueOf(v.pay, items(v));
      if (v.status === 'booked') await act(() => C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' }), v.name.split(' ')[0] + ' is checked in');
      else if (v.status === 'checked_in') await act(() => C.rpc('desk_move', { p_visit: v.visit_id, p_status: 'in_room' }), 'Sent to the room');
      else if (v.status === 'in_room') { await act(() => C.rpc('desk_move', { p_visit: v.visit_id, p_status: 'done', p_paid_how: due && !v.paid ? 'desk' : null }), 'Checked out'); S.sheet = null; }
      render();
    },
    noShow: async () => { const v = cur(); if (!v) return; await act(async () => { const id = await C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' }); await C.rpc('desk_move', { p_visit: id, p_status: 'no_show' }); }, 'Marked no-show'); S.sheet = null; render(); },
    payCard: async (id, el) => {
      const v = cur(); if (!v) return;
      let vid = v.visit_id;
      if (!vid) { vid = await act(() => C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' })); if (typeof vid !== 'string') return; }
      await toStripe('visit-checkout', { visit_id: vid }, el);
    },
    wday: i => { S.weekDay = +i; render(); }
  };
  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; S.sheet = null; render(); window.scrollTo({ top: 0 }); if (S.tab !== 'today') { (S.tab === 'week' ? loadWeek() : loadWeek().then(loadClients)).then(() => { if (!S.sheet) render(); }).catch(() => {}); } return; }
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    if (b.dataset.a === 'close' && b.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
    const fn = A[b.dataset.a]; if (fn) fn(b.dataset.id, b);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (e.target.id === 'wiName') S.wi.name = e.target.value;
    if (e.target.id === 'wiPhone') S.wi.phone = e.target.value;
    if (e.target.id === 'wiEmail') S.wi.email = e.target.value.trim();
  });
  document.addEventListener('change', async e => {
    if (e.target.id === 'spaSel') {
      S.spa = S.spas.find(s => s.slug === e.target.value) || S.spa; try { localStorage.setItem(SPA_KEY, S.spa.slug); } catch (_) {}
      S.visits = []; S.bookings = []; S.people = {}; render(); await loadSpa(); render();
    }
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'gForm') return;
    e.preventDefault();
    const em = $('#gEmail').value.trim(), pw = $('#gPass').value, btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    if (!pw) {
      try { await C.sendLink(em); S.gateMsg = 'Check your email on this phone. The link works for 24 hours.'; S.gateBad = false; }
      catch (err) { S.gateMsg = /not found|signups/i.test(err.message) ? 'That email isn’t set up for RKVR Pro. Ask RKVR HQ to add you.' : err.message; S.gateBad = true; }
      render(); return;
    }
    try { await C.signIn(em, pw); boot(); }
    catch (err) { S.gateMsg = err.status === 400 ? 'That email and password don’t match. Or leave the password blank for an email link.' : err.message; S.gateBad = true; render(); }
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render(); boot();
})();
</script>
