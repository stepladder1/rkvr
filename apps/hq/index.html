<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RKVR HQ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: sticky brand bar + section tabs, then one wide working column of panels; tables scroll inside their own frames. */
:root {
  --bg: #0E1216; --panel: #161C21; --panel-2: #1D252C; --line: rgba(242,240,234,.12); --line-strong: rgba(242,240,234,.28);
  --fg: #F2F0EA; --muted: #A9B1B8; --accent: #F2542D; --accent-text: #FF7A57; --on-accent: #0E1216;
  --ice: #7CCBFF; --good: #4FC38A; --warn: #F2B23C; --bad: #FF6B57;
  --good-bg: rgba(79,195,138,.14); --warn-bg: rgba(242,178,60,.14); --bad-bg: rgba(255,107,87,.14); --ice-bg: rgba(124,203,255,.14); --accent-bg: rgba(242,84,45,.14);
  --c1: #F2542D; --c2: #7CCBFF; --c3: #D9C9A3; --c4: #6F7C88;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ECE9E1; --panel: #FBFAF7; --panel-2: #F3F1EB; --line: rgba(14,18,22,.12); --line-strong: rgba(14,18,22,.3);
    --fg: #0E1216; --muted: #4A535C; --accent: #E04A23; --accent-text: #B83A18; --on-accent: #0E1216;
    --ice: #1F6FA8; --good: #1E8A55; --warn: #9A6200; --bad: #C2321B;
    --good-bg: rgba(30,138,85,.12); --warn-bg: rgba(154,98,0,.12); --bad-bg: rgba(194,50,27,.1); --ice-bg: rgba(31,111,168,.1); --accent-bg: rgba(224,74,35,.1);
    --c1: #E04A23; --c2: #2F8FCB; --c3: #A88B4A; --c4: #56636F;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ECE9E1; --panel: #FBFAF7; --panel-2: #F3F1EB; --line: rgba(14,18,22,.12); --line-strong: rgba(14,18,22,.3);
  --fg: #0E1216; --muted: #4A535C; --accent: #E04A23; --accent-text: #B83A18; --on-accent: #0E1216;
  --ice: #1F6FA8; --good: #1E8A55; --warn: #9A6200; --bad: #C2321B;
  --good-bg: rgba(30,138,85,.12); --warn-bg: rgba(154,98,0,.12); --bad-bg: rgba(194,50,27,.1); --ice-bg: rgba(31,111,168,.1); --accent-bg: rgba(224,74,35,.1);
  --c1: #E04A23; --c2: #2F8FCB; --c3: #A88B4A; --c4: #56636F;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); }
.brand svg { width: 74px; height: 27px; display: block; }
.brand b { font: 800 22px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill-sample { background: var(--warn-bg); color: var(--warn); }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.who img { width: 26px; height: 26px; border-radius: 50%; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); }

main { padding-block: 24px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font: 800 clamp(34px, 5vw, 52px)/.95 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.page-head p { color: var(--muted); max-width: 62ch; margin-top: 6px; }
.stamp { font-size: 12px; color: var(--muted); }

.grid { display: grid; gap: 16px; align-items: stretch; }
.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px; }
.fn-bar { height: 10px; background: var(--panel-2); }
.fn-bar i { display: block; height: 100%; background: var(--accent); }
.fn-row b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .fn-row { grid-template-columns: 110px minmax(0, 1fr) 44px; } }
.grid > .panel { display: flex; flex-direction: column; }
.chart-sum { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chart-sum b { display: block; font: 800 24px/1 var(--font-display); margin-top: 4px; }
.chart-sum .up { color: var(--good); }
.chart + .chart-sum { margin-top: auto; }
.grid > .panel > .feed, .grid > .panel > .alerts { flex: 1; }
.cols-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.cols-even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 960px) { .cols-2, .cols-even { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2 { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.panel-head .note { font-size: 12px; color: var(--muted); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 15px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .v { font: 800 clamp(28px, 4vw, 36px)/1 var(--font-display); letter-spacing: .01em; margin-top: 4px; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.alert { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.kpi.alert .v { color: var(--bad); }

/* chips & status */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-good { background: var(--good-bg); color: var(--good); }
.st-warn { background: var(--warn-bg); color: var(--warn); }
.st-bad { background: var(--bad-bg); color: var(--bad); }
.st-ice { background: var(--ice-bg); color: var(--ice); }
.st-off { background: var(--panel-2); color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.cell-main { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--muted); }
tr.dim td { opacity: .5; }

/* attention list */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: 10px; background: var(--panel-2); border-left: 4px solid var(--line-strong); }
.alert-row.bad { border-left-color: var(--bad); }
.alert-row.warn { border-left-color: var(--warn); }
.alert-row.ice { border-left-color: var(--ice); }
.alert-row .t { font-weight: 600; }
.alert-row .d { font-size: 12.5px; color: var(--muted); }
.alert-row button { margin-left: auto; flex: none; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; }
.btn:hover { border-color: var(--fg); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.05); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* feed */
.feed { display: flex; flex-direction: column; }
.feed-row { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed-row:last-child { border-bottom: 0; }
.feed-row time { color: var(--muted); font-size: 12px; }
.tag-mini { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }

/* chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font-body); }

/* bar list */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--c2); border-radius: 5px; }
.bar-row .num { text-align: right; font-weight: 600; }

/* switches */
.switch { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; border: 0; background: var(--line-strong); transition: background .15s; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: #FFFFFF; }
.switch:disabled { opacity: .4; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }

.flag-group + .flag-group { margin-top: 18px; }
.flag-group h3 { font: 800 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
.flag-group > p { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.flag { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.flag.child { padding-left: 22px; }
.flag.child .flag-name::before { content: "↳ "; color: var(--muted); }
.flag-text { flex: 1; min-width: 0; }
.flag-name { font-weight: 600; }
.flag-desc { font-size: 12.5px; color: var(--muted); }
.flag-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.flag.blocked .flag-name, .flag.blocked .flag-desc { opacity: .5; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
.banner-ice { background: var(--ice-bg); }
.banner-warn { background: var(--warn-bg); }
.banner b { font-weight: 700; }

/* settings */
.setting { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.setting label { font-weight: 600; }
.setting .flag-desc { display: block; font-weight: 400; }
.field { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel-2); overflow: hidden; }
.field span { padding: 0 8px; color: var(--muted); font-size: 13px; }
.field input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 8px 8px; text-align: right; font-weight: 600; }
.calc { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--panel-2); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.calc div b { display: block; font: 800 26px/1 var(--font-display); margin-top: 4px; }
.calc .neg { color: var(--bad); }
.calc .pos { color: var(--good); }
@media (max-width: 520px) { .calc { grid-template-columns: minmax(0, 1fr); } .setting { grid-template-columns: minmax(0,1fr) 110px; } }

/* live preview */
.previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .previews { grid-template-columns: minmax(0, 1fr); } }
.phone { background: #0E1216; color: #F2F0EA; border-radius: 22px; border: 5px solid #2A323A; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 10px; min-height: 230px; }
.phone-title { font: 800 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: #A9B1B8; }
.phone-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.phone-chips span { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border: 1px solid rgba(242,240,234,.2); }
.phone-chips span.on { color: #F2542D; border-color: #F2542D; }
.phone-card { border: 1px solid rgba(242,240,234,.16); padding: 9px; font-size: 11.5px; }
.phone-card b { display: block; font-size: 12.5px; }
.phone-card .mini-btns { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.phone-card .mini-btns span { background: #F2542D; color: #0E1216; font-weight: 700; font-size: 10.5px; padding: 3px 6px; }
.phone-card .mini-btns span.alt { background: transparent; color: #F2F0EA; border: 1px solid rgba(242,240,234,.3); }
.phone-tabs { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 10px; border-top: 2px solid #F2F0EA; padding-top: 7px; }
.phone-tabs span { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.phone-tabs span:first-child { color: #F2542D; }
.phone-off { font-size: 11px; color: #A9B1B8; font-style: italic; }

/* marketing */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.form-row { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.form-row:first-child { border-top: 0; padding-top: 0; }
.form-row > label, .form-row > .label { font-size: 12.5px; font-weight: 600; color: var(--fg); letter-spacing: 0; text-transform: none; }
.input { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel-2); padding: 9px 10px; font-size: 13.5px; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.hint { font-size: 12px; color: var(--muted); }
.reach { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); margin-top: 4px; }
.reach b { font: 800 30px/1 var(--font-display); }
.msg-preview { background: #0E1216; color: #F2F0EA; border-radius: 18px; border: 5px solid #2A323A; padding: 14px; }
.msg-preview .from { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #A9B1B8; }
.msg-preview .body { font-size: 13px; line-height: 1.45; margin-top: 6px; white-space: pre-line; }
.msg-preview .cta { display: inline-block; margin-top: 10px; background: #F2542D; color: #0E1216; font-weight: 700; font-size: 12px; padding: 6px 12px; }
.compose { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .compose { grid-template-columns: minmax(0, 1fr); } }
.time-pair { display: flex; align-items: center; gap: 8px; }
.time-pair { flex-wrap: wrap; }
.time-pair input { width: 130px; max-width: 100%; }

/* recommendations */
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: stretch; }
.rec .rec-checks { margin-top: auto; }
.rec.wide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; border-top-left-radius: 0; }
.rec-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (max-width: 860px) { .rec.wide { grid-template-columns: minmax(0, 1fr); } }
.rec-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.rec-tabs::-webkit-scrollbar { display: none; }
.rec-tabs button { flex: none; display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); border-bottom: 0; background: var(--panel); border-radius: 10px 10px 0 0; padding: 9px 14px; font-weight: 600; font-size: 13px; color: var(--muted); }
.rec-tabs button b { font: 800 18px/1 var(--font-display); color: var(--muted); }
.rec-tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 3px 0 var(--accent); }
.rec-tabs button[aria-selected="true"] b { color: var(--accent-text); }
.em-mini { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px; background: var(--panel); }
.em-mini-img { width: 64px; height: 64px; flex: none; border-radius: 6px; background: #F2F0EA; display: grid; place-items: center; overflow: hidden; }
.em-mini-img img { width: 100%; height: 100%; object-fit: contain; }
.em-mini-img svg { width: 44px; height: 16px; }
.em-mini-t { min-width: 0; font-size: 12.5px; }
.em-mini-t b { display: block; font-size: 13px; }
.em-mini-t span { color: var(--muted); display: block; }
.rec { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rec-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.rec-kind { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-text); }
.rec-est { font-size: 12px; color: var(--good); font-weight: 600; }
.rec h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
.rec-why { font-size: 12.5px; color: var(--muted); }
.rec-who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.rec-who b { font: 800 22px/1 var(--font-display); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; font-size: 12.5px; }
.rec-names { font-size: 12px; color: var(--muted); background: var(--panel); border-radius: 8px; padding: 8px 10px; }
.rec-ch { display: flex; flex-direction: column; gap: 6px; }
.rec-ch .seg button { padding: 6px 10px; font-size: 12px; }
.rec-ch .hint { font-size: 11.5px; }
.rec-checks { list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.rec-checks li::before { content: "✓ "; color: var(--good); font-weight: 700; }
.rec-checks li.no::before { content: "✕ "; color: var(--bad); }
.rec-checks li.no { color: var(--bad); }
.rec-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
.rec-actions .btn-primary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-actions .btn-primary { padding: 8px 12px; }

  const num = n => Math.round(n).toLocaleString('en-US');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const suiteById = id => SUITES.find(s => s.id === id);

  function reqUpdates(r) { return r.updates.concat((state.reqLive[r.id] || {}).updates || []); }
  function reqStatus(r) { return (state.reqLive[r.id] || {}).status || r.status; }
  function reqWaiting(r) { return reqStatus(r) !== 'Done' && !reqUpdates(r).length && r.age >= 48; }
  const prodOn = key => !state.prodOff[key];

  function metrics() {
    const S = suites(), st = state.settings, sh = share();
    const members = S.reduce((a, s) => a + s.members, 0);
    const mrr = members * st.planPrice;
    const issued = members * st.credits;
    const redeemed = S.reduce((a, s) => a + s.credits, 0);
    const payouts = redeemed * st.payout;
    const services = S.reduce((a, s) => a + s.coll, 0);
    const rentBilled = S.reduce((a, s) => a + (s.cycle === 'Weekly' ? s.rent * 4 : s.rent), 0);
    const rentPaid = S.filter(s => s.status === 'Paid').reduce((a, s) => a + (s.cycle === 'Weekly' ? s.rent * 4 : s.rent), 0);
    const visibleProducts = PRODUCTS.filter(p => flagOn('shop') && flagOn(catFlag(p.cat)) && prodOn('shop:' + PRODUCT_IMG[p.name]));
    const shopRev = PRODUCTS.reduce((a, p) => a + p.price * p.orders, 0) * sh;
    const shopOrders = PRODUCTS.reduce((a, p) => a + p.orders, 0) * sh;
    const overdue = S.filter(s => s.status === 'Overdue');
    const unpaid = S.filter(s => s.status === 'Unpaid');
    const openReq = REQUESTS.filter(r => reqStatus(r) !== 'Done' && inLoc(suiteById(r.suite)));
    const staleReq = openReq.filter(reqWaiting);
    const perCredit = st.planPrice / Math.max(1, st.credits);
    const expiring = Math.round((issued - redeemed) * 0.35);
    return { S, members, mrr, issued, redeemed, payouts, services, rentBilled, rentPaid, shopRev, shopOrders, overdue, unpaid, openReq, staleReq, perCredit, margin: perCredit - st.payout, expiring, visibleProducts,
      clients: S.reduce((a, s) => a + Math.round(s.members * 2.4), 0),

  function kpi(label, value, sub, alert) {

  }

  function chartSVG() {
    const sh = share();
    const STREAMS = ALL_STREAMS.filter(s => CR() || s.key !== 'members');
    const W = 640, H = 250, L = 46, R = 8, T = 10, B = 26;
    const totals = WEEKS.map((_, i) => STREAMS.reduce((a, s) => a + s.v[i] * sh, 0));
    const rawMax = Math.max(...totals);
    const step = rawMax > 40 ? 10 : rawMax > 16 ? 5 : rawMax > 6 ? 2 : 1;
    const max = Math.ceil(rawMax / step) * step;
    const y = v => T + (H - T - B) * (1 - v / max);
    const bw = (W - L - R) / WEEKS.length;
    let g = '';
    for (let v = 0; v <= max + 0.001; v += step) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">$${v}k</text>`;
    }
    let bars = '';
    WEEKS.forEach((w, i) => {
      let acc = 0;
      const x = L + i * bw + bw * 0.18, wdt = bw * 0.64;
      STREAMS.forEach(s => {
        const v = s.v[i] * sh;
        bars += `<rect x="${x.toFixed(1)}" y="${y(acc + v).toFixed(1)}" width="${wdt.toFixed(1)}" height="${(y(acc) - y(acc + v)).toFixed(1)}" fill="${s.color}"><title>${w} · ${s.name}: $${v.toFixed(1)}k</title></rect>`;
        acc += v;
      });
      bars += `<text x="${(x + wdt / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${w}</text>`;
      if (i === WEEKS.length - 1) bars += `<text x="${(x + wdt / 2).toFixed(1)}" y="${(y(acc) - 6).toFixed(1)}" text-anchor="middle" style="fill:var(--fg);font-weight:600">$${acc.toFixed(1)}k</text>`;
    });
    const last = STREAMS.map(s => `<span><i style="background:${s.color}"></i>${s.name} <b>$${(s.v[7] * sh).toFixed(1)}k</b></span>`).join('');
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly gross volume by stream, last 8 weeks">${g}${bars}</svg><div class="legend">${last}</div></div>`;
  }

  function chartSummary() {
    const sh = share(), streams = ALL_STREAMS.filter(x => CR() || x.key !== 'members');
    const wk = i => streams.reduce((a, x) => a + x.v[i] * sh, 0);
    const last = wk(7), prev = wk(6), avg = WEEKS.reduce((a, _, i) => a + wk(i), 0) / WEEKS.length;
    const ch = (last - prev) / prev * 100;
    return `<div class="chart-sum"><div><span class="label">This week</span><b>$${last.toFixed(1)}k</b></div><div><span class="label">Vs last week</span><b class="${ch >= 0 ? 'up' : ''}">${ch >= 0 ? '+' : '−'}${Math.abs(ch).toFixed(1)}%</b></div><div><span class="label">8-week average</span><b>$${avg.toFixed(1)}k</b></div></div>`;
  }

    const feed = FEED.filter(f => inLoc(suiteById(f.suite)) && (CR() || (f.kind !== 'Credits' && f.kind !== 'Members'))).map(f => CR() || !f.alt ? f : Object.assign({}, f, { text: f.alt }));

      <div class="kpis">
        ${kpi('Gross volume', fmtK(m.gross), CR() ? 'Services, memberships, shop and rent' : 'Services, shop and rent')}
        ${CR() ? kpi('Active members', num(m.members), fmt(m.mrr) + ' monthly recurring') : kpi('Clients', num(m.clients), 'Paying per visit')}
        ${CR() ? kpi('Services redeemed', num(m.redeemed), 'of ' + num(m.issued) + ' issued · ' + fmtK(m.payouts) + ' owed to operators', m.margin < 0) : kpi('Membership waitlist', num(m.waitlist), 'Member services launch later')}
        ${kpi('Rent collected', fmtK(m.rentPaid), 'of ' + fmtK(m.rentBilled) + ' billed · ' + m.overdue.length + ' overdue', m.overdue.length > 0)}
        ${kpi('Shop orders', num(m.shopOrders), fmtK(m.shopRev) + ' in sales')}
        ${kpi('Open requests', m.openReq.length, m.staleReq.length + ' waiting over 48 hours', m.staleReq.length > 0)}
      </div>
      ${recsPanel(3, true)}
      <div class="grid cols-2">
        <section class="panel"><div class="panel-head"><h2>Weekly gross volume</h2><span class="note">Last 8 weeks, by stream</span></div>${chartSVG()}${chartSummary()}</section>
        <section class="panel"><div class="panel-head"><h2>Needs attention</h2><span class="note">${alerts.length} items</span></div>
          <div class="alerts">${(state.alertsAll ? alerts : alerts.slice(0, 5)).map(a => `<div class="alert-row ${a.cls}"><div><div class="t">${a.t}</div><div class="d">${esc(a.d)}</div></div>${a.act}</div>`).join('')}</div>
          ${alerts.length > 5 ? `<button class="linkish" style="margin-top:10px;align-self:flex-start" data-alerts-all="1">${state.alertsAll ? 'Show fewer' : 'Show all ' + alerts.length}</button>` : ''}
        </section>
      </div>
      <div class="grid cols-2" style="margin-top:16px">
        <section class="panel"><div class="panel-head"><h2>Spas at a glance</h2><button class="btn" data-goto="suites">All spas</button></div>${suitesTable(true)}</section>

  function suitesTable(compact) {
    const rows = suites().map(s => {

        <td><div class="cell-main">RKVR ${esc(s.studio)}</div><div class="cell-sub">${esc(locShort(s))} · Phenix suites ${s.no}</div></td>

  let CLIENTS_CACHE = null;
  function clientsAll() {
    if (CLIENTS_CACHE) return CLIENTS_CACHE;
    let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const out = []; const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
    SUITES.forEach(sp => {
      const n = 14 + sp.team * 3;
      for (let i = 0; i < n; i++) {
        const r = rnd(), plan = r < 0.42 ? 'founding' : r < 0.5 ? 'member' : r < 0.9 ? 'alacarte' : 'former';
        const days = Math.floor(Math.pow(rnd(), 1.6) * 140), active = days <= 60;
        const used = plan === 'founding' || plan === 'member' ? (active ? Math.min(12, 2 + Math.floor(rnd() * 11)) : 0) : 0;
        let mtd = 0, mtdN = 0; if (plan !== 'founding' && plan !== 'member' && days <= 21) { mtdN = 1 + Math.floor(rnd() * 3); for (let k = 0; k < mtdN; k++) mtd += MENU[Math.floor(rnd() * MENU.length)][1]; }
        const ytdN = Math.floor(rnd() * (plan === 'alacarte' ? 14 : 5)), ytd = mtd + ytdN * (45 + Math.floor(rnd() * 120));
        const last = MENU[Math.floor(rnd() * MENU.length)][0];
        const d = new Date(2026, 9, 21 - days);
        out.push({ id: sp.id + '-' + i, name: FIRSTS[Math.floor(rnd() * FIRSTS.length)] + ' ' + LASTS[Math.floor(rnd() * LASTS.length)], spa: sp.id, plan, active, days, used, mtd, mtdN, ytd, last,
          lastDate: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), since: mon[Math.floor(rnd() * (d.getMonth() + 1))] + ' 2026' });
      }
    });
    return (CLIENTS_CACHE = out);

  function renderRequests() {
    const list = REQUESTS.filter(r => inLoc(suiteById(r.suite)));
    const open = list.filter(r => reqStatus(r) !== 'Done');
    const ro = canChange() ? '' : 'disabled';
    const rows = list.map(r => {
      const s = suiteById(r.suite), stt = reqStatus(r), ups = reqUpdates(r), last = ups[ups.length - 1];
      const ageTxt = stt === 'Done' ? 'Closed' : r.age >= 24 ? Math.round(r.age / 24) + ' days' : r.age + ' hrs';
      const isOpen = state.reqOpen === r.id;
      const lastTxt = last ? 'Last update ' + last.at : (stt === 'Done' ? '' : 'No reply yet');
      const row = `<tr class="${isOpen ? 'req-open' : ''}"><td><div class="cell-main">${r.id}</div><div class="cell-sub">${r.type}</div></td><td><div>${esc(r.what)}</div>${r.urgent ? '<div class="cell-sub" style="color:var(--bad);font-weight:600">Urgent</div>' : ''}<div class="cell-sub" style="${!last && stt !== 'Done' ? 'color:var(--warn)' : ''}">${lastTxt}</div></td><td>${esc(suiteLabel(s))}<div class="cell-sub">${esc(s.pro)} · ${esc(locShort(s))}</div></td><td class="num" style="${reqWaiting(r) ? 'color:var(--bad);font-weight:600' : ''}">${ageTxt}</td><td>${statusChip(stt)}</td><td><button class="btn ${!last && stt !== 'Done' ? 'btn-primary' : ''}" data-req-open="${r.id}">${isOpen ? 'Close' : last || stt === 'Done' ? 'Messages' : 'Send update'}</button></td></tr>`;
      if (!isOpen) return row;
      const d = Object.assign({ status: stt === 'Open' && !ups.length ? 'Scheduled' : stt, eta: '', text: '', text2: false }, state.reqDraft[r.id] || {});
      const first = s.pro.replace(/^Dr\. /, '').split(' ')[0];
      const thread = [{ from: 'owner', at: r.filed, text: r.note }].concat(ups).map(u => `<div class="msg ${u.from === 'rkvr' ? 'rkvr' : 'owner'}"><span class="who">${u.from === 'rkvr' ? 'RKVR' + (u.by ? '' : '') : esc(s.pro)} · ${esc(u.at)}${u.status ? ' · ' + esc(u.status) : ''}</span>${esc(u.text)}${u.eta ? `<div class="stamp-s">ETA ${esc(u.eta)}</div>` : ''}</div>`).join('');
      const steps = REQ_STATUSES.map((x, i) => `<span class="${x === stt ? 'now' : REQ_STATUSES.indexOf(stt) > i ? 'on' : ''}">${x}</span>`).join('');
      const panel = `<tr class="req-open"><td colspan="6"><div style="display:grid;gap:12px">
        <div class="steps" aria-label="Status">${steps}</div>
        <div class="thread">${thread}</div>
        ${canChange() ? `<div class="req-compose">
          <div class="full"><span class="label">Quick replies</span><div class="chips" style="margin-top:6px">${REQ_QUICK.map((q, i) => `<button type="button" data-req-quick="${r.id}" data-i="${i}">${q.label}</button>`).join('')}</div></div>
          <div><label class="label" for="rq-status-${r.id}">Status</label><select id="rq-status-${r.id}" class="input" data-req-field="status" data-req="${r.id}">${REQ_STATUSES.map(x => `<option ${x === d.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
          <div><label class="label" for="rq-eta-${r.id}">When (optional)</label><input id="rq-eta-${r.id}" class="input" placeholder="e.g. Thu Oct 22, 9–11 AM" data-req-field="eta" data-req="${r.id}" value="${esc(d.eta)}"></div>
          <div class="full"><label class="label" for="rq-text-${r.id}">Message to ${esc(first)}</label><textarea id="rq-text-${r.id}" class="input" style="min-height:76px" data-req-field="text" data-req="${r.id}" placeholder="What’s happening and when">${esc(d.text)}</textarea></div>
          <div class="full" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
            <label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" data-req-field="text2" data-req="${r.id}" ${d.text2 ? 'checked' : ''}> Also text ${esc(first)}</label>
            <span class="hint">Shows on the request in RKVR Pro with an app notification.</span>
            <button class="btn btn-primary" data-req-send="${r.id}">Send update</button>
          </div></div>` : '<div class="hint">View only. RKVR admins can send updates.</div>'}
      </div></td></tr>`;
      return row + panel;
    }).join('');
    const waiting = open.filter(reqWaiting);
    return head('Service requests', 'Repairs owners have filed. Send status updates and messages so they know help is on the way.') + `
      ${flagOn('requests') ? '' : '<div class="banner banner-warn"><span><b>Service requests are off.</b> Owners can’t file new requests from RKVR Pro.</span></div>'}

        ${kpi('Urgent', open.filter(r => r.urgent).length, 'Safety issues', open.some(r => r.urgent && !reqUpdates(r).length))}

      <section class="panel"><div class="panel-head"><h2>All requests</h2><span class="note">Owners see every update on the request in RKVR Pro</span></div>
        ${rows ? `<div class="tbl-wrap"><table><thead><tr><th>Request</th><th>Issue</th><th>Spa</th><th class="num">Age</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No requests at this location.</div>'}
      </section>`;
  }

  function flagRow(item, group) {
    const raw = !!state.flags[item.k];
    const parentKey = item.parent || group.parent || item.gate;
    const blocked = !!((item.parent || group.parent) && !flagOn(item.parent || group.parent)) || !!(item.gate && !flagOn(item.gate));
    const blockKey = (item.parent || group.parent) && !flagOn(item.parent || group.parent) ? (item.parent || group.parent) : item.gate;
    const count = item.cat ? PRODUCTS.filter(p => p.cat === item.cat).length + ' products' : '';
    const desc = item.desc || count;
    const stateTxt = blocked ? 'Off with ' + FLAG_NAMES[blockKey].replace('Shop category · ', '') : raw ? 'On' : (item.planned ? 'Off · launches later' : 'Off');
    return `<div class="flag${item.parent ? ' child' : ''}${blocked ? ' blocked' : ''}">
      <div class="flag-text"><div class="flag-name">${item.name}${item.planned && !raw ? ' <span class="st st-off" style="margin-left:6px">Planned</span>' : ''}</div><div class="flag-desc">${desc}</div></div>
      <span class="flag-state">${stateTxt}</span>
      <button class="switch" role="switch" aria-checked="${raw}" aria-label="${esc(FLAG_NAMES[item.k])}" data-flag="${item.k}" ${canChange() ? '' : 'disabled'}></button>
    </div>`;
  }

  function mkSegments() { return MK_SEGMENTS.filter(g => CR() || (g.id !== 'members' && g.id !== 'expiring')); }
  function mkTypes() { return MK_TYPES.filter(t => CR() || t.id !== 'credits'); }
  function mkRules() { return Object.assign({}, DEFAULT_MK_RULES, state.mkRules || {}); }
  function mkTemplate() { return (mkTypes().find(t => t.id === state.mk.type) || MK_TYPES[0]).tpl; }
  function mkText() { return state.mk.text || mkTemplate(); }
  function mkResolve() {
    let t = mkText().replace(/\{first\}/g, 'Ava');
    if (state.mk.channel === 'text') t += '\nReply STOP to opt out.';
    if (state.mk.channel === 'email') t += '\n\nUnsubscribe · RKVR, San Diego CA';
    return t;
  }
  function mkReach() {
    const mk = state.mk;
    const S = SUITES.filter(x => mk.locs[x.loc]);
    const clients = S.reduce((a, x) => a + Math.round(x.members * 2.4), 0);
    const seg = mkSegments().find(g => g.id === mk.seg) || MK_SEGMENTS[0];
    const frac = seg.id === 'bought' ? (MK_CAT_FRAC[mk.cat] || 0.1) : seg.frac;
    const total = Math.round(clients * frac);
    const out = Math.round(total * OPT_OUT);
    return { total, out, reach: total - out, suites: S.length };
  }
  function allCampaigns() {
    const fromDb = state.campaigns.map(c => Object.assign({ live: true }, c));
    const sample = SAMPLE_CAMPAIGNS.filter(c => !c.suite || inLoc(suiteById(c.suite)));
    return fromDb.concat(sample);
  }

        : `<div class="recs">${shown.map(r => recCard(r)).join('')}</div>`}

    </section>`;

  function relTime(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  /* ---------------- persistence ---------------- */
  async function writeDoc(path, body) {
    if (!db) return true;
    try { await db.doc(path).set(body); return true; }
    catch (e) {
      if (e && e.code === 'unavailable') { try { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); await db.doc(path).set(body); return true; } catch (e2) { /* fall through */ } }
      toast('Couldn’t save that change. Try again in a moment.');
      return false;
    }
  }

      audience: { segment: r.audience, recommendation: r.id }, type: r.type, text: st.text, email: st.ch === 'email' ? st.email : null,
      createdAt: new Date().toISOString(), by: state.me || null };

  async function saveMkLimits() {
    if (!canChange()) return;
    const rules = mkRules();
    const per = parseInt(document.getElementById('mkr-perWeek').value, 10);
    const max = parseFloat(document.getElementById('mkr-maxDiscount').value);
    const qs = document.getElementById('mkr-quietStart').value, qe = document.getElementById('mkr-quietEnd').value;
    if (!(per >= 0)) { toast('Messages per client needs a number of 0 or more.'); return; }
    if (!(max >= 0 && max <= 100)) { toast('Largest discount needs a number from 0 to 100.'); return; }
    if (!qs || !qe) { toast('Set both quiet-hour times.'); return; }
    const changes = [];
    if (per !== rules.perWeek) changes.push('messages per client to ' + per);
    if (max !== rules.maxDiscount) changes.push('largest discount to ' + max + '%');
    if (qs !== rules.quietStart || qe !== rules.quietEnd) changes.push('quiet hours to ' + qs + '–' + qe);
    if (!changes.length) { toast('No changes to save.'); return; }
    state.mkRules = Object.assign({}, rules, { perWeek: per, maxDiscount: max, quietStart: qs, quietEnd: qe });
    render();
    if (await writeDoc('config/marketing', state.mkRules)) { toast('Saved'); addLog('Changed owner marketing ' + changes.join(', ')); }
  }

  /* ---------------- sign-in (Supabase) ---------------- */
  function gate(html) {
    document.body.classList.add('gated');
    $('#main').innerHTML = `<section class="gate"><div class="gate-card">${html}</div></section>`;
  }
  function showLogin(msg, isError) {
    gate(`<h1>Sign in</h1><p class="cell-sub">RKVR HQ is for RKVR corporate staff.</p>
      ${msg ? `<div class="gate-msg ${isError ? 'bad' : ''}" role="${isError ? 'alert' : 'status'}">${esc(msg)}</div>` : ''}
      <form id="login-form" class="gate-form">
        <label class="label" for="li-email">Email</label><input class="input" id="li-email" type="email" autocomplete="username" required>
        <label class="label" for="li-pass">Password</label><input class="input" id="li-pass" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <button class="linkish" type="button" id="li-forgot">Forgot password?</button>
      </form>`);
    const em = $('#li-email'); if (em) em.focus();
  }
  function showSetPassword() {
    gate(`<h1>Set your password</h1><p class="cell-sub">Choose a password for RKVR HQ. At least 8 characters.</p>
      <form id="pw-form" class="gate-form">
        <label class="label" for="pw-new">New password</label><input class="input" id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
        <button class="btn btn-primary" type="submit">Save password</button>
      </form>`);
  }
  function showNoAccess(p) {
    gate(`<h1>No HQ access</h1><p>${esc((p && (p.email || p.full_name)) || 'This account')} is signed in, but it isn’t set up as RKVR HQ staff.</p>
      <p class="cell-sub">Ask an RKVR admin to give this account HQ access, then sign in again.</p>
      <button class="btn" type="button" data-signout="1">Sign out</button>`);
  }
  function ungate() { document.body.classList.remove('gated'); }

  async function connect() {
    const C = window.RKVR_CLOUD;
    if (C) {
      let p = null;
      try { p = await C.ensureSession(); }
      catch (e) { showLogin('Can’t reach the RKVR database right now. Check your connection and try again.', true); return; }
      if (C.linkType && C.linkType.startsWith('error:')) { showLogin(C.linkType.slice(6), true); return; }
      if (!p) { showLogin(); return; }
      if (C.linkType === 'recovery' || C.linkType === 'invite') { showSetPassword(); return; }
      if (p.role !== 'hq_admin') { showNoAccess(p); return; }
      ungate();
      user = C.user; db = C.db;
      const w = $('#who');
      w.innerHTML = `<span>${esc(p.full_name || p.email)} · Admin</span><button class="btn btn-sm" type="button" data-signout="1">Sign out</button>`;
      renderLocSelect();
    } else {
      try {
        user = window.claude && window.claude.use ? await window.claude.use('user') : null;
        db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      } catch (e) { db = null; }
    }
    if (user && !window.RKVR_CLOUD) {
      try {
        const me = await user.me();
        state.me = me.id;
        const w = $('#who');
        w.innerHTML = '';
        const img = document.createElement('img'); img.src = me.avatarUrl; img.alt = '';
        const nm = document.createElement('span'); nm.textContent = (me.name || 'You') + (me.canEdit ? ' · Admin' : ' · View only');
        w.append(img, nm);
      } catch (e) { /* identity is optional */ }
    }
    if (!db) { state.mode = 'local'; render(); return; }
    const canEdit = user ? await user.canEdit() : false;
    state.mode = canEdit ? 'saved' : 'readonly';
    const listen = (path, apply) => db.doc(path).onSnapshot(snap => {
      if (snap.exists) { apply(snap.data() || {}); render(); }
    }, () => { /* keep the last known state */ });
    listen('config/features', d => { state.flags = Object.assign({}, DEFAULT_FLAGS, d); });
    listen('config/settings', d => { state.settings = Object.assign({}, DEFAULT_SETTINGS, d); });
    listen('config/suites', d => { state.paused = Object.assign({}, d.paused || {}); });
    listen('config/log', d => { state.log = Array.isArray(d.entries) ? d.entries.slice(0, 40) : []; });
    listen('config/marketing', d => { state.mkRules = Object.assign({}, DEFAULT_MK_RULES, d); });
    listen('config/products', d => { state.prodOff = Object.assign({}, d.off || {}); });
    listen('config/requests', d => { state.reqLive = Object.assign({}, d); });
    listen('config/recs', d => { state.recMeta = { sent: d.sent || {}, snoozed: d.snoozed || {}, dismissed: d.dismissed || {} }; });
    db.collection('campaigns').orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => {
      state.campaigns = snap.docs.map(x => x.data() || {}); render();
    }, () => { /* keep the last known list */ });
    render();
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.signout) { window.RKVR_CLOUD.signOut().then(() => location.reload()); return; }
    if (t.id === 'li-forgot') {
      const em = ($('#li-email').value || '').trim();
      if (!em) { showLogin('Enter your email first, then tap Forgot password.', true); return; }
      window.RKVR_CLOUD.resetPassword(em).then(() => showLogin('If that email has an account, a reset link is on its way.'), err => showLogin(err.message, true));
      return;
    }
    if (t.dataset.tab) { state.tab = t.dataset.tab; try { history.replaceState(null, '', '#' + state.tab); } catch (_) {} render(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.goto) { state.tab = t.dataset.goto; try { history.replaceState(null, '', '#' + state.tab); } catch (_) {} render(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.flag) { toggleFlag(t.dataset.flag); return; }
    if (t.dataset.pause) { togglePause(t.dataset.pause); return; }
    if (t.dataset.remind) { const s = suiteById(t.dataset.remind); state.reminded[s.id] = true; render(); toast('Reminder queued for ' + s.studio + ' (sample)'); return; }
    if (t.id === 'save-settings') { saveSettings(); return; }
    if (t.dataset.mkLoc !== undefined) { const l = Object.assign({}, state.mk.locs); l[t.dataset.mkLoc] = !l[t.dataset.mkLoc]; state.mk = Object.assign({}, state.mk, { locs: l }); render(); return; }
    if (t.dataset.mkChannel) { state.mk = Object.assign({}, state.mk, { channel: t.dataset.mkChannel }); render(); return; }
    if (t.dataset.mkrule) { toggleMkRule(t.dataset.mkrule); return; }
    if (t.id === 'mk-send') { sendCampaign(); return; }
    if (t.id === 'mk-save-rules') { saveMkLimits(); return; }
    const d = t.dataset;
    if (d.recCh) { setRecUI(d.recCh, { channel: d.ch }); render(); return; }
    if (d.prod) { toggleProd(d.prod); return; }
    if (d.reqJump) { state.tab = 'requests'; state.reqOpen = d.reqJump; try { history.replaceState(null, '', '#requests'); } catch (_) {} render(); window.scrollTo({ top: 0 }); return; }
    if (d.reqOpen) { state.reqOpen = state.reqOpen === d.reqOpen ? null : d.reqOpen; render(); return; }
    if (d.reqSend) { sendReqUpdate(d.reqSend); return; }
    if (d.reqQuick) {
      const r = REQUESTS.find(x => x.id === d.reqQuick), s = suiteById(r.suite), q = REQ_QUICK[+d.i];
      const dr = reqDraft(r.id), first = s.pro.replace(/^Dr\. /, '').split(' ')[0];
      const eta = dr.eta || (q.status === 'Scheduled' ? 'tomorrow, 9–11 AM' : q.status === 'In progress' ? 'Friday' : '');
      dr.status = q.status; dr.text = q.text.replace('{first}', first).replace('{eta}', eta); if (!dr.eta && eta && q.status !== 'Open') dr.eta = eta;
      state.reqDraft = Object.assign({}, state.reqDraft, { [r.id]: dr }); render();
      const el = document.getElementById('rq-text-' + r.id); if (el) el.focus();
      return;
    }
    if (d.alertsAll) { state.alertsAll = !state.alertsAll; render(); return; }
    if (d.clStatus || d.clPlan) { state.cl = Object.assign({}, state.cl, d.clStatus ? { status: d.clStatus } : { plan: d.clPlan }, { lim: 25 }); render(); return; }
    if (d.clMore) { state.cl = Object.assign({}, state.cl, { lim: ((state.cl && state.cl.lim) || 25) + 25 }); render(); return; }
    if (d.recTab) { state.recTab = d.recTab; render(); return; }
    if (d.recFull) { setRecUI(d.recFull, { fullEmail: !(state.recUI[d.recFull] || {}).fullEmail }); render(); return; }
    if (d.recWho) { setRecUI(d.recWho, { showWho: !(state.recUI[d.recWho] || {}).showWho }); render(); return; }
    if (d.recEdit) { setRecUI(d.recEdit, { editing: !(state.recUI[d.recEdit] || {}).editing }); render(); return; }
    if (d.recSend) { sendRec(d.recSend); return; }
    if (d.recSnooze) { snoozeRec(d.recSnooze); return; }
    if (d.recDismiss) { setRecUI(d.recDismiss, { dismissing: true }); render(); return; }
    if (d.recCancel) { setRecUI(d.recCancel, { dismissing: false }); render(); return; }
    if (d.recReason) { dismissRec(d.recReason, d.reason); return; }
    if (d.recRestore) { restoreRecs(); return; }
    if (d.emTarget && d.emHero !== undefined) { const sp = emailSpecFor(d.emTarget); sp.hero = d.emHero || null; setEmailSpec(d.emTarget, sp, true); return; }
    if (d.emTarget && d.emProd) {
      const sp = emailSpecFor(d.emTarget), cur = (sp.products || []).slice(), i = cur.indexOf(d.emProd);
      if (i >= 0) cur.splice(i, 1); else { if (cur.length >= 2) { toast('Up to 2 featured products per email.'); return; } cur.push(d.emProd); }
      sp.products = cur; setEmailSpec(d.emTarget, sp, true); return;
    }
  });
  document.addEventListener('change', e => {
    const rd = e.target.dataset || {};
    if (rd.req && rd.reqField && (rd.reqField === 'status' || rd.reqField === 'text2')) {
      const dr = reqDraft(rd.req); dr[rd.reqField] = rd.reqField === 'text2' ? e.target.checked : e.target.value;
      state.reqDraft = Object.assign({}, state.reqDraft, { [rd.req]: dr }); return;
    }
    const f = e.target.dataset && e.target.dataset.mkField;
    if (!f) return;
    const patch = { [f]: e.target.value };
    if (f === 'type') patch.text = '';
    state.mk = Object.assign({}, state.mk, patch);
    render();
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'cl-q') { state.cl = Object.assign({}, state.cl, { q: e.target.value, lim: 25 }); const b = clientBody(); $('#cl-body').innerHTML = b.html || '<tr><td colspan="7" class="cell-sub">No clients match.</td></tr>'; $('#cl-count').textContent = 'Showing ' + Math.min(b.n, 25) + ' of ' + num(b.n); const mb = document.querySelector('[data-cl-more]'); if (mb) mb.hidden = !b.more; return; }
    const dd = e.target.dataset || {};
    if (dd.req && (dd.reqField === 'text' || dd.reqField === 'eta')) { const dr = reqDraft(dd.req); dr[dd.reqField] = e.target.value; state.reqDraft = Object.assign({}, state.reqDraft, { [dd.req]: dr }); return; }
    if (dd.recText) { setRecUI(dd.recText, { text: e.target.value }); refreshPreview('rec:' + dd.recText); return; }
    if (dd.emTarget && dd.emField) { const sp = emailSpecFor(dd.emTarget); sp[dd.emField] = e.target.value; setEmailSpec(dd.emTarget, sp, false); return; }
    const f = dd.mkText;
    if (!f) return;
    state.mk[f] = e.target.value;
    const p = document.getElementById('mk-prev'); if (p && f === 'text') p.textContent = mkResolve();
    const c = document.getElementById('mk-count'); if (c && f === 'text') c.textContent = smsInfo(mkResolve());
    if (f === 'text' && state.mk.channel === 'email') refreshPreview('mk');
  });
  $('#loc').addEventListener('change', e => { state.loc = e.target.value; try { localStorage.setItem('rkvr-hq-loc', state.loc); } catch (_) {} render(); });

  document.addEventListener('submit', async e => {
    if (e.target.id === 'login-form') {
      e.preventDefault();
      const b = e.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Signing in…';
      try { await window.RKVR_CLOUD.signIn($('#li-email').value.trim(), $('#li-pass').value); location.reload(); }
      catch (err) { showLogin(err.status === 400 ? 'That email and password don’t match.' : err.message, true); }
    }
    if (e.target.id === 'pw-form') {
      e.preventDefault();
      try { await window.RKVR_CLOUD.updatePassword($('#pw-new').value); location.reload(); }
      catch (err) { toast(err.message); }
    }
  });

  /* ---------------- boot ---------------- */
  const fromHash = (location.hash || '').replace('#', '');
  if (TABS.some(t => t.id === fromHash)) state.tab = fromHash;
  try { const l = localStorage.getItem('rkvr-hq-loc'); if (l && (l === 'all' || LOCS[+l])) state.loc = l; } catch (_) {}
  renderLocSelect();
  if (window.RKVR_CLOUD) { document.body.classList.add('gated'); $('#main').innerHTML = '<section class="gate"><p class="cell-sub">Loading…</p></section>'; } else render();
  connect();
})();
</script>

</body>
