<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RKVR Desk">
<meta name="theme-color" content="#0E1216">
<title>RKVR Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* One iPad on a swivel stand, landscape. The stage is drawn at 1194x834 and scaled to fit the screen.
   Pro side = staff; Client side = self check-in, walk-ins, join. */
:root { --bg:#0E1216; --panel:#182027; --panel2:#1F2830; --line:rgba(242,240,234,.12); --line2:rgba(242,240,234,.26); --fg:#F2F0EA; --muted:#A9B1B8; --soft:#C9CFD4; --accent:#F2542D; --accentText:#FF7A57; --ink:#0E1216; --ice:#7CCBFF; --iceBg:rgba(124,203,255,.12); --iceLine:rgba(124,203,255,.4); --accBg:rgba(242,84,45,.14);
  --display:'Big Shoulders Display','Arial Narrow',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05080A; overflow: hidden; }
body { font-family: var(--body); color: var(--fg); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, p { margin: 0; }
#stage { position: absolute; left: 0; top: 0; width: 1194px; height: 834px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
.disp { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accentText); }
.muted { color: var(--muted); }
.logo { height: 28px; width: auto; display: block; color: var(--fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn { height: 44px; padding: 0 14px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.btn.big { height: 52px; font-size: 16px; }
.btn.off, .btn:disabled { background: var(--panel2); border-color: var(--panel2); color: var(--muted); }
.link { background: none; border: 0; color: var(--accentText); font-weight: 700; padding: 0; height: 44px; }
.chip { padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }

/* ---------- Pro ---------- */
.pro { height: 100%; display: flex; flex-direction: column; font-size: 15px; }
.pro header { display: flex; align-items: center; gap: 18px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.protag { padding: 3px 7px; border: 1px solid var(--line2); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.spasel { background: transparent; border: 0; padding: 0; font: 800 20px/1 var(--display); text-transform: uppercase; color: var(--fg); max-width: 220px; }
.spasel option { background: var(--panel); font: 600 14px var(--body); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line2); padding: 0 12px; height: 44px; width: 190px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 14px; }
.pro main { flex: 1; min-height: 0; padding: 16px 24px 18px; display: flex; flex-direction: column; gap: 16px; }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 620px minmax(0,1fr); gap: 16px; }
.box { background: var(--panel); border: 1px solid var(--line); min-width: 0; min-height: 0; }
.list { display: flex; flex-direction: column; overflow: hidden; }
.list-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.rows { overflow-y: auto; }
.row { display: grid; grid-template-columns: 88px minmax(0,1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; min-height: 60px; padding: 10px 18px; border: 0; border-bottom: 1px solid rgba(242,240,234,.08); background: transparent; color: var(--fg); }
.row.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font: 800 19px/1 var(--display); white-space: nowrap; }
.row .nm { font-weight: 700; }
.row .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side { padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.vrow { display: grid; grid-template-columns: 22px 70px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vrow .n { font: 800 20px/1 var(--display); color: var(--accentText); }
.paybox { background: var(--panel2); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.note { padding: 10px 12px; border-left: 3px solid var(--ice); background: var(--iceBg); font-size: 13.5px; }
.warn { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accBg); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border: 1px solid var(--line2); }
.seg button { height: 44px; border: 0; background: transparent; font-weight: 700; font-size: 13.5px; }
.seg button.on { background: var(--accent); color: var(--ink); }
.pick { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); }
.pick:disabled { opacity: .4; }
.cb { width: 24px; height: 24px; border: 2px solid var(--line2); color: var(--ink); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.rooms { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 8px; }
.room { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.room b { font: 800 17px/1 var(--display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room span { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
.mini input { height: 44px; padding: 0 12px; border: 1px solid var(--line2); background: var(--panel2); font-size: 15px; }

/* ---------- Client ---------- */
.client { height: 100%; padding: 32px 48px 36px; display: flex; flex-direction: column; gap: 26px; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 24px; min-height: 44px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.steps li { white-space: nowrap; padding: 7px 11px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
.steps li.on { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.steps li.done { color: var(--fg); border-color: var(--line2); }
.two { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 56px; }
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.col.mid { justify-content: center; }
.h1 { font: 800 72px/.92 var(--display); text-transform: uppercase; }
.lede { color: var(--muted); font-size: 21px; line-height: 1.45; }
.tile { text-align: left; padding: 26px; border: 1px solid var(--line2); background: var(--panel); color: var(--fg); display: flex; flex-direction: column; gap: 8px; }
.tile.hot { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.tile .disp { font-size: 44px; }
.band { display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; min-height: 64px; padding: 14px 20px; border: 1px solid var(--iceLine); background: var(--iceBg); color: var(--fg); }
.screen { height: 76px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.keys { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
.keys button { height: 76px; border: 1px solid var(--line); background: var(--panel); font-size: 30px; font-weight: 600; }
.cta { height: 76px; flex-shrink: 0; border: 1px solid var(--accent); background: var(--accent); color: var(--ink); font-size: 21px; font-weight: 700; }
.cta:disabled { background: var(--panel2); border-color: var(--panel2); color: var(--muted); }
.ghost { height: 60px; border: 1px solid var(--line2); background: transparent; font-size: 18px; font-weight: 700; }
.err { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accBg); font-size: 16px; }
.card { background: var(--panel); border: 1px solid var(--line2); padding: 24px; }
.crow { display: grid; grid-template-columns: 28px 86px minmax(0,1fr) auto; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.crow .n { font: 800 28px/1 var(--display); color: var(--accentText); }
.tiles { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; overflow-y: auto; min-height: 0; }
.svc { position: relative; text-align: left; min-height: 118px; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); }
.svc.on { border-color: var(--accent); background: var(--panel2); }
.svc:disabled { opacity: .4; }
.svc .cb { width: 30px; height: 30px; font: 800 18px/1 var(--display); }
.paycards { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
.pc { text-align: left; padding: 24px; display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); }
.pc.on { border-color: var(--accent); background: var(--panel2); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; }
.field input { height: 56px; padding: 0 16px; border: 1px solid var(--line2); background: var(--panel); font-size: 19px; }
.field input:focus { outline: none; border-color: var(--accent); }
.sigwrap { position: relative; flex: 1; min-height: 200px; border: 2px dashed var(--line2); background: var(--panel); }
.sigwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.sigwrap .ph[hidden] { display: none; }
.sigwrap .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 19px; pointer-events: none; }
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
.tick { width: 112px; height: 112px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.qr { background: #fff; padding: 10px; display: block; }

/* Gate (sign-in), PIN */
.gate .logo { align-self: flex-start; }
.gate { height: 100%; display: grid; grid-template-columns: 1fr 460px; gap: 64px; align-items: center; padding: 48px 72px; }
.gate form, .gate .gbox { display: flex; flex-direction: column; gap: 14px; }
.gmsg { padding: 12px 14px; border-left: 3px solid var(--ice); background: var(--iceBg); font-size: 15px; }
.gmsg.bad { border-color: var(--accent); background: var(--accBg); }
.scrim { position: absolute; inset: 0; background: rgba(5,8,10,.8); display: flex; align-items: center; justify-content: center; z-index: 5; }
.pin { width: 420px; background: var(--panel); border: 1px solid var(--line2); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.dots { display: flex; gap: 14px; justify-content: center; }
.dots i { width: 18px; height: 18px; border: 2px solid var(--line2); border-radius: 50%; }
.dots i.on { background: var(--fg); border-color: var(--fg); }
.pin .keys button { height: 64px; font-size: 26px; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--ink); padding: 12px 18px; font-weight: 700; z-index: 6; max-width: 80%; text-align: center; }
.offline { position: absolute; top: 0; left: 0; right: 0; background: var(--accent); color: var(--ink); text-align: center; font-weight: 700; font-size: 13px; padding: 4px; z-index: 4; }
</style>
</head>
<body>
<div id="stage" aria-live="off"></div>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
(function () {
  const C = window.RKVR_CLOUD;
  const CFG = window.RKVR_CONFIG || {};
  const MAX = 3, POLL = 15000, PIN_KEY = 'rkvr-desk-pin', SPA_KEY = 'rkvr-desk-spa';
  const ROOM = { cryo: 'Cryo Chamber', red: 'Red Light Bed', comp: 'Compression', chair: 'Massage Chair', iv: 'IV Lounge', wl: 'Consult Room', tw: 'Consult Room' };

  /* ---------------- state ---------------- */
  const freshClient = () => ({ step: 'start', path: null, digits: '', err: '', agree: false, signed: false, sel: [], pay: 'alacarte', found: null, name: '', phone: '', email: '', busy: false, visitId: null, due: 0, paidOnline: false, joinedOnline: false });
  const S = {
    gate: 'loading', gateMsg: '', gateBad: false,
    mode: 'pro', pin: null, pinMode: 'check', pinNext: null,
    spas: [], spa: null, svcs: [], plan: null, visits: [], day: null, offline: false,
    pro: { sel: null, q: '', panel: 'client', wiSel: [], wiPay: 'alacarte', wiName: '', wiPhone: '' },
    c: freshClient(), busy: false
  };
  let toastT, focusSearch = false, pollT = null;

  /* ---------------- helpers ---------------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => '$' + (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
  const tz = () => (S.spa && S.spa.time_zone) || 'America/Los_Angeles';
  const tfmt = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz() });
  const fmtPhone = d => !d ? '' : d.length < 4 ? '(' + d : '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + (d.length > 6 ? '-' + d.slice(6, 10) : '');
  const svcById = id => S.svcs.find(s => s.id === id);
  const MONTHLY = () => S.plan ? S.plan.founding_price_cents || S.plan.price_cents : 9900;
  const LATER = () => S.plan ? S.plan.price_cents : 12900;
  const CUTOFF = () => S.plan && S.plan.founding_cutoff ? new Date(S.plan.founding_cutoff + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Dec 31, 2026';
  const covers = (pay, it) => (pay === 'member' || pay === 'join') && it.member_included;
  const dueOf = (pay, items) => items.reduce((a, it) => a + (covers(pay, it) ? 0 : it.price_cents), 0);
  const listPrice = items => items.reduce((a, it) => a + it.price_cents, 0);
  const asItems = ids => ids.map(svcById).filter(Boolean).map(s => ({ service_id: s.id, name: s.name, category: s.category, minutes: s.minutes, price_cents: s.price_cents, member_included: s.member_included }));
  const LOGO = '<svg class="logo" viewBox="-4 -32 380 140" role="img" aria-label="RKVR"><g fill="currentColor"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g><g fill="currentColor" transform="translate(96 0)"><rect x="0" y="0" width="24" height="100"/><polygon points="24,50 51.5,0 79.5,0 52,50 79.5,100 51.5,100"/></g><g transform="translate(183 0)"><polygon fill="currentColor" points="0,0 26,0 58,100 32,100"/><polygon fill="#F2542D" points="78.32,-26 104.32,-26 64,100 38,100"/></g><g fill="currentColor" transform="translate(287 0)"><rect x="0" y="0" width="24" height="100"/><path fill-rule="evenodd" d="M0 0H50A30 30 0 0 1 50 60H0Z M24 20H50A10 10 0 0 1 50 40H24Z"/><polygon points="28.5,50 56.5,50 84,100 56,100"/></g></svg>';
  const TICK = '<div class="tick"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#0E1216" stroke-width="2.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';
  const QR = (size, label) => `<img class="qr" src="qr-join.svg" width="${size}" height="${size}" alt="${esc(label || 'QR code to join RKVR on your phone')}">`;
  function toast(m) { clearTimeout(toastT); document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; $('#stage').appendChild(t); toastT = setTimeout(() => t.remove(), 3200); }
  const META = {
    booked: ['Booked', 'transparent', 'var(--fg)', 'var(--line2)'],
    waiver: ['Needs waiver', 'rgba(242,84,45,.16)', 'var(--accentText)', 'rgba(242,84,45,.5)'],
    checked_in: ['Here', 'rgba(124,203,255,.14)', 'var(--ice)', 'var(--iceLine)'],
    in_room: ['In room', 'var(--accent)', 'var(--ink)', 'var(--accent)'],
    done: ['Checked out', 'transparent', 'var(--muted)', 'var(--line)'],
    no_show: ['No-show', 'transparent', 'var(--muted)', 'var(--line)']
  };
  const needsWaiver = v => v.status === 'booked' && !v.waiver;
  const chipFor = v => { const m = META[needsWaiver(v) ? 'waiver' : v.status] || META.booked; return `<span class="chip" style="background:${m[1]};color:${m[2]};border-color:${m[3]}">${m[0]}</span>`; };
  const payShort = p => p === 'member' ? 'Member' : p === 'join' ? 'New member' : 'À la carte';
  const items = v => v.items || [];

  /* ---------------- data ---------------- */
  async function loadSpa() {
    const sp = S.spa;
    const [svcs, plans] = await Promise.all([
      C.rest('services?select=id,name,category,minutes,price_cents,member_included,sort&active=is.true&spa_id=eq.' + sp.id + '&order=sort'),
      C.rest('membership_plans?select=*&id=eq.rkvr')
    ]);
    S.svcs = svcs || []; S.plan = plans && plans[0];
    await refresh(true);
  }
  async function refresh(force) {
    if (!S.spa || (S.busy && !force)) return;
    try {
      const d = await C.rpc('desk_today', { spa_slug: S.spa.slug });
      S.visits = (d && d.visits) || []; S.day = d && d.day; S.offline = false;
      if (S.pro.sel && !S.visits.some(v => v.key === S.pro.sel)) S.pro.sel = null;
      if (!S.pro.sel && S.visits.length) S.pro.sel = (S.visits.find(v => v.status !== 'done') || S.visits[0]).key;
    } catch (e) {
      S.offline = true;
      if (e.status === 401) { S.gate = 'login'; S.gateMsg = 'You’ve been signed out. Sign in again.'; S.gateBad = true; }
    }
    // Don't redraw under someone typing or signing
    const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName) && document.activeElement.id !== 'q';
    if (!typing && !(S.mode === 'client' && S.c.step === 'details')) render();
  }
  function startPolling() {
    clearInterval(pollT);
    pollT = setInterval(() => { if (!document.hidden) refresh(); }, POLL);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  async function act(fn, okMsg) {
    if (S.busy) return false;
    S.busy = true;
    try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(true); return r == null ? true : r; }
    catch (e) { toast(e.message || 'Something went wrong. Try again.'); return false; }
    finally { S.busy = false; }
  }

  /* ---------------- Stripe (pay or join on this iPad) ---------------- */
  const RETURN_KEY = 'rkvr-desk-return';
  // Sends the iPad to Stripe's secure page. `done` and `cancel` say what to show when it comes back.
  async function goStripe(fn, args, done, cancel, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Opening secure checkout…'; }
    try {
      const r = await C.callFn(fn, Object.assign({ return_url: location.origin + location.pathname }, args));
      try { sessionStorage.setItem(RETURN_KEY, JSON.stringify({ done, cancel, spa: S.spa.slug })); } catch (_) {}
      location.href = r.url;
      return true;
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || 'Try again'; }
      toast(e.code === 'paid' ? 'That visit is already paid.' : e.message);
      return false;
    }
  }
  async function confirmReturn() {
    const csM = /[?&]cs=(cs_[A-Za-z0-9_]+)/.exec(location.search); if (csM) { try { await C.callFn('checkout-confirm', { session_id: csM[1] }); } catch (e) { console.warn('[RKVR] confirm', e); } }
  }
  function restoreReturn() {
    let m = null; try { m = JSON.parse(sessionStorage.getItem(RETURN_KEY) || 'null'); sessionStorage.removeItem(RETURN_KEY); } catch (_) {}
    const q = new URLSearchParams(location.search), ok = q.has('paid') || q.has('joined');
    if (q.has('paid') || q.has('joined')) { try { history.replaceState(null, '', location.pathname); } catch (_) {} }
    if (!m) return;
    const st = ok ? m.done : m.cancel;
    if (!st) return;
    S.mode = st.mode || 'pro';
    if (st.c) S.c = Object.assign(freshClient(), st.c);
    if (st.sel) S.pro.sel = st.sel;
    if (st.toast) toast(ok ? st.toast : 'Payment cancelled. Nothing was charged.');
    else if (!ok) toast('Nothing was charged.');
  }

  // Search every client of this spa, not just today's list
  let findT;
  function findClients() {
    clearTimeout(findT);
    const q = S.pro.q.trim().toLowerCase();
    if (q.length < 2) { S.found = null; return; }
    findT = setTimeout(async () => {
      const safe = q.replace(/[,()*%]/g, ' ').trim();
      try {
        const rows = await C.rest('profiles?select=id,full_name,email,phone,memberships(status)&role=eq.client&or=(full_name.ilike.*' + encodeURIComponent(safe) + '*,email.ilike.*' + encodeURIComponent(safe) + '*)&order=full_name&limit=8');
        const today = new Set(S.visits.map(v => (v.name || '').toLowerCase()));
        S.found = { q, rows: (rows || []).filter(p => !today.has((p.full_name || '').toLowerCase())).map(p => Object.assign(p, { member: (p.memberships || []).some(m => /active|past_due/.test(m.status)) })) };
      } catch (_) { S.found = { q, rows: [] }; }
      if (S.pro.q.trim().toLowerCase() === q) { focusSearch = true; render(); }
    }, 300);
  }

  /* ---------------- gate ---------------- */
  function renderGate() {
    const left = `<div style="display:flex;flex-direction:column;gap:20px">${LOGO}<span class="eyebrow">Front desk</span><h1 class="disp" style="font-size:96px;line-height:.9">RKVR<br>Check-In.</h1><p class="lede" style="max-width:28ch">For RKVR spa staff. Sign in once on this iPad and it stays signed in.</p></div>`;

    else if (S.gate === 'noaccess') right = `<div class="gbox"><h2 class="disp" style="font-size:40px">No desk access</h2>${msg}<p class="muted" style="font-size:16px;line-height:1.5">This account isn’t set up as a spa operator or RKVR HQ staff. Ask RKVR HQ to add you on the Team page, then sign in again.</p><button class="ghost" data-a="signOut">Sign out</button></div>`;
    else if (S.gate === 'nospa') right = `<div class="gbox"><h2 class="disp" style="font-size:40px">No spa yet</h2><p class="muted" style="font-size:16px;line-height:1.5">You’re signed in, but no RKVR spa is assigned to you yet. Ask RKVR HQ to pick your spa on the Team page.</p><button class="ghost" data-a="signOut">Sign out</button></div>`;

  async function boot() {
    if (!C) { S.gate = 'login'; S.gateMsg = 'This copy isn’t connected to the RKVR database.'; S.gateBad = true; render(); return; }
    if (C.pendingLink) { S.gate = 'continue'; render(); return; }
    let p = null;
    try { p = await C.loadProfile(); } catch (e) { S.gate = 'login'; S.gateMsg = 'Can’t reach RKVR right now. Check the Wi-Fi and try again.'; S.gateBad = true; render(); return; }
    if (!p) { S.gate = 'login'; render(); return; }
    if (!['operator', 'hq_admin', 'super_admin'].includes(p.role)) { S.gate = 'noaccess'; render(); return; }
    // Super Admins see every spa; operators and HQ Staff see the ones they run or are assigned
    let spas;
    if (p.role === 'super_admin') spas = await C.rest('spas?select=id,slug,name,time_zone,status&order=name');
    else { const ids = ((await C.rpc('my_spa_ids')) || []).map(x => typeof x === 'string' ? x : x.my_spa_ids || Object.values(x)[0]); spas = ids.length ? await C.rest('spas?select=id,slug,name,time_zone,status&order=name&id=in.(' + ids.join(',') + ')') : []; }
    S.spas = (spas || []).sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1));
    if (!S.spas.length) { S.gate = 'nospa'; render(); return; }
    let saved = null; try { saved = localStorage.getItem(SPA_KEY); } catch (_) {}
    S.spa = S.spas.find(s => s.slug === saved) || S.spas[0];
    try { S.pin = localStorage.getItem(PIN_KEY); } catch (_) {}
    S.gate = null; S.gateMsg = '';
    render();
    await confirmReturn();
    restoreReturn();
    render();
    await loadSpa(); startPolling();
  }

  /* ---------------- PIN ---------------- */

  /* ---------------- render + fit ---------------- */
  function render() {
    let html;
    if (S.gate) html = renderGate();
    else html = (S.mode === 'pro' ? renderPro() : renderClient()) + (S.pinOpen ? renderPin() : '') + (S.offline ? '<div class="offline" role="status">Can’t reach RKVR. Retrying…</div>' : '');
    $('#stage').innerHTML = html;
    if (focusSearch) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } focusSearch = false; }
    if (!S.gate && S.mode === 'client' && S.c.step === 'details') setupSig();
  }
  function fit() {
    const st = $('#stage'), s = Math.min(innerWidth / 1194, innerHeight / 834);
    st.style.transform = `translate(${(innerWidth - 1194 * s) / 2}px, ${(innerHeight - 834 * s) / 2}px) scale(${s})`;
    S.scale = s;
  }
  addEventListener('resize', fit);

  // Signature pad: draws with a finger or mouse; we keep only that it was signed and when
  function setupSig() {
    const cv = $('#sig'); if (!cv) return;
    const r = cv.getBoundingClientRect(), s = S.scale || 1;
    cv.width = Math.round(r.width / s); cv.height = Math.round(r.height / s);
    const ctx = cv.getContext('2d'); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#F2F0EA';
    let down = false, len = 0;
    const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / (S.scale || 1), (e.clientY - b.top) / (S.scale || 1)]; };
    cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
    cv.onpointermove = e => { if (!down) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); len++; };
    cv.onpointerup = () => { down = false; if (len > 8 && !S.c.signed) { S.c.signed = true; const ph = document.querySelector('.sigwrap .ph'); if (ph) ph.hidden = true; updateDetailsBtn(); } };
  }
  function updateDetailsBtn() { const c = S.c, b = document.querySelector('[data-a="cDetailsNext"]'); if (b) b.disabled = !(c.agree && c.signed && (c.path === 'booking' || (c.name && (c.pay !== 'join' || /@/.test(c.email)))) && !c.busy); }

  /* ---------------- actions ---------------- */
  const sel = () => S.visits.find(x => x.key === S.pro.sel);
  function goC(step, extra) { Object.assign(S.c, { step, err: '' }, extra || {}); render(); }
  function openPin(mode, next) { S.pinOpen = true; S.pinMode = mode; S.pinEntry = ''; S.pinNext = next; render(); }
  const A = {
    gContinue: async () => { try { await C.verifyLink(); } catch (e) { S.gate = 'login'; S.gateMsg = e.message; S.gateBad = true; render(); return; } boot(); },
    gLink: async () => {
      const em = ($('#gEmail').value || '').trim();
      if (!em) { S.gateMsg = 'Enter your email first.'; S.gateBad = true; render(); return; }
      try { await C.sendLink(em); S.gateMsg = 'Check your email on this iPad. The link works for 24 hours.'; S.gateBad = false; }
      catch (e) { S.gateMsg = /not found|signups/i.test(e.message) ? 'That email isn’t set up for RKVR. Ask RKVR HQ to add you.' : e.message; S.gateBad = true; }
      render();
    },
    gPw: () => { const em = ($('#gEmail').value || '').trim(); S.usePw = !S.usePw; S.gateMsg = ''; render(); if (em) $('#gEmail').value = em; },
    signOut: async () => { await C.signOut(); try { localStorage.removeItem(PIN_KEY); } catch (_) {} location.reload(); },
    pick: id => { S.pro.sel = id; S.pro.panel = 'client'; render(); },
    walkin: () => { S.pro.panel = 'walkin'; render(); },

    toClient: () => {

    },
    toPro: () => openPin('check', () => { S.mode = 'pro'; render(); }),
    pinForgot: () => A.signOut(),
    pinKey: k => {
      if (k === 'Cancel') { S.pinOpen = false; render(); return; }
      if (k === 'Delete') S.pinEntry = S.pinEntry.slice(0, -1); else if (S.pinEntry.length < 4) S.pinEntry += k;
      if (S.pinEntry.length < 4) { render(); return; }
      const entry = S.pinEntry;
      if (S.pinMode === 'set') { S.pinFirst = entry; S.pinMode = 'confirm'; S.pinEntry = ''; render(); return; }
      if (S.pinMode === 'confirm') {
        if (entry !== S.pinFirst) { S.pinMode = 'set'; S.pinEntry = ''; render(); toast('Those didn’t match. Try again.'); return; }
        S.pin = entry; try { localStorage.setItem(PIN_KEY, entry); } catch (_) {}
        S.pinOpen = false; toast('PIN saved on this iPad'); const n = S.pinNext; S.pinNext = null; if (n) n(); else render(); return;
      }
      if (entry === S.pin) { S.pinOpen = false; const n = S.pinNext; S.pinNext = null; if (n) n(); else render(); return; }
      S.pinEntry = ''; render(); toast('Wrong PIN');
    },
    markWaiver: () => { const v = sel(); if (v && v.booking_id) act(() => C.rpc('desk_waiver', { p_booking: v.booking_id }), 'Waiver marked signed'); },
    advance: () => {
      const v = sel(); if (!v) return;
      const due = dueOf(v.pay, items(v));
      if (v.status === 'booked') act(() => C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' }), v.name.split(' ')[0] + ' is checked in');
      else if (v.status === 'checked_in') act(() => C.rpc('desk_move', { p_visit: v.visit_id, p_status: 'in_room' }));
      else if (v.status === 'in_room') act(() => C.rpc('desk_move', { p_visit: v.visit_id, p_status: 'done', p_paid_how: due && !v.paid ? 'desk' : null }), 'Checked out' + (due && !v.paid ? ' · ' + money(due) + ' collected' : ''));
    },
    noShow: async () => {
      const v = sel(); if (!v || !v.booking_id) return;
      await act(async () => { const id = await C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' }); await C.rpc('desk_move', { p_visit: id, p_status: 'no_show' }); }, 'Marked no-show');
    },
    offer: () => { S.mode = 'client'; S.c = Object.assign(freshClient(), { step: 'join', path: 'join' }); if (!S.pin) { S.mode = 'pro'; openPin('set', () => { S.mode = 'client'; render(); }); return; } render(); },
    soon: () => toast('Coming soon'),
    payCard: async (id, el) => {
      const v = sel(); if (!v) return;
      let vid = v.visit_id;
      if (!vid) { vid = await act(() => C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'desk' })); if (typeof vid !== 'string') return; }
      await goStripe('visit-checkout', { visit_id: vid }, { mode: 'pro', sel: v.key, toast: 'Payment received ✓' }, { mode: 'pro', sel: v.key }, el);
    },
    wiPay: id => { S.pro.wiPay = id; render(); },
    wiToggle: id => { const a = S.pro.wiSel, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else if (a.length < MAX) a.push(id); render(); },
    addWalk: async () => {
      const P = S.pro;
      const ph = (P.wiPhone || '').replace(/\D/g, '').slice(-10);
      if (P.wiPay === 'member' && ph.length !== 10) { toast('Enter the member’s 10-digit mobile number'); return; }
      if (P.wiPay !== 'member' && !P.wiName.trim()) { toast('Add their name'); return; }
      if (P.wiPay === 'join' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(P.wiEmail || '')) { toast('Add their email for the membership'); return; }
      const r = await act(() => C.rpc('desk_walk_in', { spa_slug: S.spa.slug, p_services: P.wiSel, p_pay: P.wiPay, p_phone: ph || null, p_name: P.wiName.trim() || null, p_source: 'desk', p_waiver: false }));
      if (!r) return;
      if (r.error === 'no_member') { toast('No active membership for that number. Try à la carte or Join.'); return; }
      toast(r.name + ' is checked in');
      const join = P.wiPay === 'join', who = { name: P.wiName.trim(), email: P.wiEmail, phone: ph };
      S.pro = Object.assign(S.pro, { panel: 'client', sel: 'v:' + r.visit_id, wiSel: [], wiName: '', wiPhone: '', wiEmail: '' }); render();
      if (join) await goStripe('membership-checkout', { for: Object.assign(who, { spa_id: S.spa.id, visit_id: r.visit_id }) }, { mode: 'pro', sel: 'v:' + r.visit_id, toast: 'Membership payment received. Welcome to RKVR!' }, { mode: 'pro', sel: 'v:' + r.visit_id });
    },
    key: k => { const c = S.c; if (k === 'Clear') c.digits = ''; else if (k === 'Delete') c.digits = c.digits.slice(0, -1); else if (c.digits.length < 10) c.digits += k; c.err = ''; render(); },
    cBooking: () => goC('phone', { path: 'booking', digits: '' }),
    cWalk: () => goC('services', { path: 'walkin', sel: [] }),
    cJoin: () => goC('join', { path: 'join' }),
    cJoinDesk: () => goC('done', { path: 'join' }),
    cJoinForm: () => goC('joinform', { path: 'join' }),
    cJoinBack: () => goC('join'),
    cJoinPay: async (id, el) => {
      const c = S.c;
      if (!c.name.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) { c.err = 'Add your name and a valid email.'; render(); return; }
      await goStripe('membership-checkout', { for: { name: c.name.trim(), email: c.email, phone: c.phone, spa_id: S.spa.id } },
        { mode: 'client', c: { path: 'join', step: 'done', joinedOnline: true } }, { mode: 'client', c: { path: 'join', step: 'joinform', name: c.name, email: c.email, phone: c.phone } }, el);
    },
    cPayNow: async (id, el) => {
      const c = S.c, snap = JSON.parse(JSON.stringify(c));
      await goStripe('visit-checkout', { visit_id: c.visitId }, { mode: 'client', c: Object.assign({}, snap, { step: 'done', paidOnline: true, busy: false }) }, { mode: 'client', c: Object.assign({}, snap, { step: 'card', busy: false }) }, el);
    },
    cPayDesk: () => goC('done'),
    cBack: () => { const c = S.c; goC(c.path === 'walkin' ? 'pay' : 'start'); },
    cReset: () => { S.c = freshClient(); render(); },
    cFind: async () => {
      const c = S.c, d = c.digits;
      if (c.path === 'booking') {
        await refresh(true);
        const v = S.visits.find(x => x.phone === d && x.status === 'booked' && !x.walk_in);
        if (!v) { c.err = 'We couldn’t find a booking for that number today. Walk in instead, or ask the front desk.'; render(); return; }
        goC('confirm', { found: v });
      } else {
        c.busy = true; render();
        const r = await act(() => C.rpc('desk_walk_in', { spa_slug: S.spa.slug, p_services: c.sel, p_pay: 'member', p_phone: d, p_source: 'kiosk', p_waiver: false }));
        c.busy = false;
        if (!r) { render(); return; }
        if (r.error === 'no_member') { c.err = 'We couldn’t find a membership for that number. Pay à la carte or join instead.'; render(); return; }
        if (r.amount_cents > 0) goC('card', { visitId: r.visit_id, due: r.amount_cents }); else goC('done');
      }
    },
    cConfirm: async () => {
      const v = S.c.found;
      if (!v.waiver) { goC('details', { agree: false, signed: false }); return; }
      S.c.busy = true; render();
      const vid = await act(() => C.rpc('desk_check_in', { p_booking: v.booking_id, p_source: 'kiosk' }));
      S.c.busy = false;
      afterBookingCheckIn(vid);
    },
    cToggle: id => { const a = S.c.sel, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else if (a.length < MAX) a.push(id); render(); },
    cToPay: () => goC('pay'),
    cToServices: () => goC('services'),
    cPick: id => { S.c.pay = id; render(); },
    cPayNext: () => goC(S.c.pay === 'member' ? 'phone' : 'details', { digits: '', agree: false, signed: false }),
    cSigClear: () => { S.c.signed = false; render(); },
    cDetailsBack: () => { const c = S.c; goC(c.path === 'booking' ? 'confirm' : 'pay'); },
    cDetailsNext: async () => {
      const c = S.c; if (c.busy) return;
      c.busy = true; updateDetailsBtn();
      if (c.path === 'booking') {
        const vid = await act(() => C.rpc('desk_check_in', { p_booking: c.found.booking_id, p_source: 'kiosk', p_waiver: true }));
        c.busy = false; afterBookingCheckIn(vid); return;
      }
      const r = await act(() => C.rpc('desk_walk_in', { spa_slug: S.spa.slug, p_services: c.sel, p_pay: c.pay, p_phone: c.phone.replace(/\D/g, '').slice(-10) || null, p_name: c.name, p_source: 'kiosk', p_waiver: true }));
      c.busy = false;
      if (!r || r === true) { render(); return; }
      if (c.pay === 'join') {
        const snap = JSON.parse(JSON.stringify(c));
        c.busy = true; updateDetailsBtn();
        const ok = await goStripe('membership-checkout', { for: { name: c.name.trim(), email: c.email, phone: c.phone, spa_id: S.spa.id, visit_id: r.visit_id } },
          { mode: 'client', c: Object.assign({}, snap, { step: 'done', joinedOnline: true, visitId: r.visit_id }) }, { mode: 'client', c: Object.assign({}, snap, { step: 'done', visitId: r.visit_id }) });
        if (!ok) goC('done');
        return;
      }
      if (r.amount_cents > 0) goC('card', { visitId: r.visit_id, due: r.amount_cents }); else goC('done');
    }
  };

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    const fn = A[b.dataset.a]; if (fn) { e.preventDefault(); fn(b.dataset.id, b); }
  });
  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'q') { S.pro.q = e.target.value; focusSearch = true; render(); findClients(); }
    else if (id === 'wiName') S.pro.wiName = e.target.value;
    else if (id === 'wiPhone') S.pro.wiPhone = e.target.value;
    else if (id === 'wiEmail') S.pro.wiEmail = e.target.value.trim();
    else if (id === 'dName') { S.c.name = e.target.value.trim(); updateDetailsBtn(); }
    else if (id === 'dPhone') S.c.phone = e.target.value;
    else if (id === 'dEmail') { S.c.email = e.target.value.trim(); updateDetailsBtn(); }
    else if (id === 'jName') S.c.name = e.target.value;
    else if (id === 'jEmail') S.c.email = e.target.value.trim();
    else if (id === 'jPhone') S.c.phone = e.target.value;
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'dAgree') { S.c.agree = e.target.checked; updateDetailsBtn(); }
    if (e.target.id === 'spaSel') {
      S.spa = S.spas.find(s => s.slug === e.target.value) || S.spa; S.pro.sel = null; S.visits = [];
      try { localStorage.setItem(SPA_KEY, S.spa.slug); } catch (_) {}
      render(); loadSpa();
    }
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'gForm') return;
    e.preventDefault();
    const em = $('#gEmail').value.trim(), pw = S.usePw && $('#gPass') ? $('#gPass').value : '';
    if (!pw) { A.gLink(); return; }
    try { await C.signIn(em, pw); boot(); }
    catch (err) { S.gateMsg = err.status === 400 ? 'That email and password don’t match. Or use “Email me a sign-in link”.' : err.message; S.gateBad = true; render(); }
  });

  fit(); render(); boot();
})();
</script>
</body>
</html>
