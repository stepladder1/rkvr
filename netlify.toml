# Used by the Netlify site whose base directory is the repo root (/):
# that site is the public website.
[build]
  publish = "apps/website"

# Server code for Stripe (secrets live in Netlify environment variables, never in the repo)
[functions]
  directory = "apps/website/netlify/functions"
  node_bundler = "esbuild"

# Texts (Twilio): every 2 minutes, send the confirmations, reminders and welcomes that are due
[functions."sms-cron"]
  schedule = "*/2 * * * *"
